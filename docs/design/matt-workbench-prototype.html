if(state.phase==='Shape') output=`<p><span class="green">❯</span> /grill-with-docs</p><div class="prompt">把 Matt 的工作流放进 Herdr，需要先确定哪些信息始终可见。</div><p><span class="green">●</span> 我把当前问题整理成了一个决策 frontier。</p><div class="code">❓ Q1 · 阶段变化是否自动切换整个 layout？<br><span class="green">→ 推荐保留工作台，只切换右侧阅读重点。</span><br><br>❓ Q2 · agent done 是否可用于关闭 ticket？<br><span class="green">→ 推荐只视为注意力信号，完成状态读 tracker。</span></div><p class="muted">GLOSSARY.md 已有更新，等待你确认共同理解。</p>`;
else if(state.phase==='Review') output=`<p><span class="green">❯</span> /code-review prototype-base</p><div class="prompt">审阅范围固定为 a71d2c0...b83e119；以下均为演示报告。</div><p><span class="green">● Standards</span> · 1 项建议</p><div class="code"><span class="orange">△</span> frontier 判断需要保留未知状态，不能默认当作 ready。</div><p><span class="blue">● Spec</span> · 尚未完成</p><p class="muted">待核对：agent done → idle 后，任务依赖是否保持不变。</p><p class="dim">报告只适用于固定 revision；代码变化后需重新验证。</p>`;
else if(state.phase==='Explore') output=`<p><span class="green">❯</span> /prototype</p><div class="prompt">验证问题：终端优先、任务优先和单会话聚焦，哪种布局更适合日常工作？</div><p><span class="green">●</span> 三个结构使用相同的任务与证据。</p><div class="code">A · 终端是中心，工件常驻右侧<br>B · 任务与依赖是中心，终端在下方<br>C · 只聚焦当前工作，队列放在左侧</div><p class="muted">使用底部切换条比较；状态保留在内存中。</p>`;
else if(state.phase==='Retro') output=`<p><span class="green">❯</span> /retro</p><div class="prompt">来源：当前演示 session。复盘聚焦下一轮 agent 的工作环境。</div><p><span class="orange">△</span> 观察：曾把运行状态当作任务完成。</p><div class="code">机械性问题 → 给任务依赖判断增加确定性检查<br>判断性问题 → 将证据过期规则写进 review 规范<br>导航问题   → 给 spec、ticket 和报告保留来源指针</div><p class="muted">以上是拟议改进，尚未写入任何规范文件。</p>`;
else output=`<p><span class="green">❯</span> /implement .scratch/matt-workbench/issues/${t.path}</p><div class="prompt">${t.name}。保持 tracker 原文可追溯，未知状态不放行下游。</div><p><span class="green">●</span> ${state.agent==='working'?'正在处理当前行为切片。':'当前这一轮已停止输出，等待人查看。'}</p><div class="term-line"><span class="bullet">↳</span><span class="muted">读取 spec.md 和 ticket 的阻塞关系。</span></div><div class="term-line"><span class="bullet">↳</span><span class="muted">确认 02 的验收记录，保留原始文件指针。</span></div><div class="code"><span class="green">PASS</span> 已完成前置工作时，可显示未认领任务<br><span class="green">PASS</span> blocker 状态未知时，不把下游标为 ready<br><span class="orange">TODO</span> agent done 不应改变 tracker 的任务状态</div><p class="muted">下一步：核对第三个场景的证据，再进入双轴审阅。</p><div class="term-rule"></div><p class="dim">演示 tracker 约定：complete = 已验收；03 仍为 active。<br>这一约定只属于 fixture，不假设所有 Matt 项目相同。</p>`;
return `<section class="terminal"><div class="terminal-head"><span class="avatar" style="width:20px;height:20px;font-size:10px">C</span><span>Codex</span><span class="dim mono">· terminal t-demo-03</span><span class="grow"></span><span class="${state.agent==='working'?'green':'orange'} tiny"><i class="dot"></i> ${state.agent==='working'?'working':state.agent==='done'?'done · 待查看':'idle · 已查看'}</span><button class="icon" data-action="focus" aria-label="定位终端">⌖</button></div><div class="terminal-body">${output}</div>${compact?'':`<div class="term-footer"><div class="input-fake"><span class="green">❯</span><span class="grow">演示终端 · 点击界面操作查看状态变化</span><span class="cursor"></span></div><div class="row spread tiny dim" style="margin-top:10px"><span>上下文占用：未知</span><span>${state.phase} / 手动标注</span></div></div>`}</section>`}
function ticketCard(t){return `<button class="ticket ${state.ticket===t.id?'selected':''} ${t.status==='blocked'?'blocked-card':''}" data-ticket="${t.id}"><div class="row spread"><span class="mono tiny dim">${t.id} / IMPLEMENTATION</span><span class="${t.status==='ready'?'green':t.status==='blocked'?'orange':'dim'} tiny">${t.tag}</span></div><div class="ticket-title">${t.name}</div><div class="ticket-meta"><span>◈ ${t.status==='active'?'Codex · '+state.agent:t.status==='complete'?'验收记录已提供':'未认领'}</span><span class="grow"></span><span>↗</span></div>${t.status==='blocked'?`<div class="dependency">⌁ 等待 ${t.blockers.join(' + ')} 的验收</div>`:''}</button>`}
function detail(short=false){const t=current();return `<div class="row spread"><span class="mono tiny dim">TICKET ${t.id}</span>${badge(t.tag,t.status==='ready'?'green':'')}</div><h2 class="detail-title">${t.name}</h2><div class="data-row"><span class="dim">Tracker</span><span class="mono">${t.status}</span></div><div class="data-row"><span class="dim">前置工作</span><span>${t.blockers.length?t.blockers.join(' · '):'无'}</span></div><div class="data-row"><span class="dim">验收证据</span><span class="${t.status==='complete'?'green':'orange'}">${t.status==='complete'?'已提供':state.evidence==='stale'?'已过期':'未提供'}</span></div>${short?'':`<div class="section-title" style="margin-top:24px">Acceptance</div><div class="check"><span class="green">✓</span><span>显示 blocker 的来源和状态</span></div><div class="check"><span class="green">✓</span><span>未知依赖不进入可开始集合</span></div><div class="check"><span class="orange">□</span><span>运行状态不会改变任务完成状态</span></div><div class="file-row"><span class="dim">▧</span><button data-action="source" class="filename">${t.path}</button></div>`}<div style="display:flex;gap:8px;margin-top:18px">${button(t.status==='active'?'定位当前会话':'预览新会话','new-session',t.status==='blocked'?'':'primary')}${button('来源 ↗','source')}</div>`}
function inspector(){let content='';if(state.panel==='frontier')content=`<div class="row spread"><span class="section-title" style="margin:0">可开始的工作</span>${badge('1 READY','green')}</div>${ticketCard(tickets[3])}<div class="section-title" style="margin-top:23px">当前工作</div>${ticketCard(tickets[2])}<div class="note">03 仍未验收。即使 agent 显示 done，05 也不会被放行。</div><div class="section-title" style="margin-top:25px">等待依赖</div>${ticketCard(tickets[4])}`;
else if(state.panel==='artifact')content=`<div class="section-title">上下文指针</div>${['spec.md','GLOSSARY.md',current().path,'review/standards.md','review/spec.md'].map(f=>`<div class="file-row"><span class="dim">▧</span><button data-file="${f}" class="filename">${f}</button><span class="dim tiny">↗</span></div>`).join('')}<div class="note info">工件存在只能说明有文件。阶段完成由人明确判断。</div><div class="section-title" style="margin-top:26px">工作集合</div><div class="filename muted" style="line-height:1.9">matt-workbench<br>.scratch/matt-workbench/</div>`;
else if(state.panel==='evidence')content=`<div class="section-title">验证与审阅</div><div class="data-row"><span>测试报告</span><span class="green">2 场景通过 · 模拟</span></div><div class="data-row"><span>Standards review</span><span class="orange">1 项建议 · 模拟</span></div><div class="data-row"><span>Spec review</span><span class="orange">未提供</span></div><div class="data-row"><span>revision</span><span class="mono tiny">b83e119</span></div><div class="note ${state.evidence==='stale'?'':'info'}">${state.evidence==='stale'?'代码已变化，旧报告过期。':'报告只属于固定版本，测试通过不能替代 Spec 审阅。'}</div>${button('模拟代码变化','stale')}<div style="margin-top:22px">${button(state.agent==='working'?'模拟 agent done':state.agent==='done'?'模拟查看 → idle':'重置为 working','agent-done')}</div>`;
else content=detail();return `<aside class="inspector"><div class="panel-tabs">${[['frontier','工作'],['artifact','工件'],['evidence','证据'],['detail','详情']].map(([k,v])=>`<button class="panel-tab ${state.panel===k?'active':''}" data-panel="${k}">${v}</button>`).join('')}</div><div class="panel-content">${content}</div></aside>`}
function VariantA(){return `${sidebar()}<main class="workspace">${tabs()}${flowbar()}<div class="contentA ${state.rightOpen?'panel-open':''}"><div class="terminal-wrap">${terminal()}<div class="mini-info"><span class="orange">◷</span><span class="grow muted">先核对验收，再选择下一项工作。</span><button class="tiny blue" data-action="agent-done">${state.agent==='working'?'演练 agent done →':state.agent==='done'?'查看通知 → idle':'恢复 working →'}</button></div></div>${inspector()}</div></main>`}
function VariantB(){return `${sidebar()}<main class="board-work">${flowbar()}<header class="board-head"><div><div class="upper dim" style="margin-bottom:9px">Effort / matt-workbench</div><h1>让下一步工作清晰可见</h1><p>任务依赖决定可开始集合；agent 状态只负责提醒你。</p></div>${button('查看工件 ↗','artifact')}</header><div class="board-grid"><div><div class="lane-header"><b class="green">○ 可开始</b><span>1 item</span></div>${ticketCard(tickets[3])}<div class="note info">已通过 02 的前置验收。<br>可在新上下文开始这一行为切片。</div></div><div><div class="lane-header"><b class="blue">◉ 正在处理</b><span>1 item</span></div>${ticketCard(tickets[2])}<div class="row tiny muted" style="padding:5px">◈ Codex <span class="grow"></span><span class="${state.agent==='working'?'green':'orange'}">${state.agent}</span><button class="blue" data-action="agent-done">模拟变化 ↗</button></div></div><div><div class="lane-header"><b class="dim">⌁ 等待依赖</b><span>2 items</span></div>${ticketCard(tickets[4])}${ticketCard(tickets[5])}</div></div><div class="board-bottom">${terminal(true)}<div class="board-detail">${detail(true)}</div></div></main>`}
function VariantC(){return `<aside class="focus-queue"><div class="row spread"><span class="upper muted">Your attention</span>${badge('2')}</div><h2>一次聚焦一项工作</h2><p class="tiny dim" style="line-height:1.8">先处理当前问题，再决定上下文如何交接。</p><div class="section-title section-space">当前会话</div><button class="queue-row active" data-ticket="03"><div class="row spread"><span>Frontier 视图</span><i class="dot green"></i></div><p>Codex · ticket 03 · ${state.agent}</p></button><div class="section-title section-space">下一项可开始</div><button class="queue-row" data-ticket="04"><div class="row spread"><span>阶段条与上下文</span><span class="green">↗</span></div><p>ticket 04 · 无未完成的前置工作</p></button><div class="section-title section-space">等待</div><button class="queue-row" data-ticket="05"><span class="muted">会话定位入口</span><p>等待 03 + 04 验收</p></button><div class="side-bottom"><button class="tiny blue" data-action="all-work">展开全部工作 ↗</button><div class="tiny dim" style="margin-top:12px">上下文：未知 · tracker 只读</div></div></aside><main class="focus-main"><header class="focus-heading"><div class="grow"><div class="upper dim" style="margin-bottom:10px">Matt workbench / ticket ${state.terminalTicket}</div><h1>${tickets[2].name}</h1><p>本机会话 t-demo-03 · Spec → Ticket → 原始验收依据</p></div>${badge('手动阶段','dim')}${button('阶段交接 ↗','boundary')}</header>${flowbar()}<div class="focus-body"><div class="focus-evidence"><button class="evidence-card" data-action="source"><span class="upper dim">Work</span><div>${tickets[2].status} · ${tickets[2].tag}</div></button><button class="evidence-card" data-action="agent-done"><span class="upper dim">Agent</span><div class="${state.agent==='working'?'green':'orange'}">${state.agent} · 点击演练状态变化</div></button><button class="evidence-card" data-action="evidence"><span class="upper dim">Evidence</span><div class="orange">${state.evidence==='stale'?'旧报告过期':'尚未完整验收'}</div></button></div>${terminal()}</div></main>`}
function PrototypeSwitcher(){const local=location.protocol==='file:'||['localhost','127.0.0.1','::1'].includes(location.hostname);if(!local)return '';return `<div class="state-readout">variant=${state.variant} · phase=${state.phase} · ticket=${state.ticket} · agent=${state.agent} · acceptance=${state.evidence}</div>${state.drawer?`<pre class="state-drawer">${esc(JSON.stringify({...state,fixture:'示意数据；complete 仅为本 fixture 的完成约定',ticketSnapshot:current()},null,2))}</pre>`:''}<nav class="switcher" aria-label="原型布局切换"><button class="arrow" data-cycle="-1" aria-label="上一种布局">←</button><span class="hint">UI PROTOTYPE</span>${Object.entries(variants).map(([k,v])=>`<button class="choice ${state.variant===k?'current':''}" data-variant="${k}" aria-label="${k} ${v}" aria-pressed="${state.variant===k}">${k}<span class="variant-name"> ${v}</span></button>`).join('')}<button class="arrow" data-cycle="1" aria-label="下一种布局">→</button><button class="statebutton" data-action="state">{ } 状态</button></nav>`}
function render(){ $('#app').innerHTML=`<div class="proto-banner"><b>THROWAWAY PROTOTYPE</b><span>哪种布局更适合 Matt SDLC？</span><span>所有任务、输出和证据均为模拟</span></div><div class="shell">${titlebar()}<div class="body">${({A:VariantA,B:VariantB,C:VariantC,D:typeof VariantD==='function'?VariantD:VariantB,E:VariantB})[state.variant]()}</div>${footer()}</div>${PrototypeSwitcher()}`; }
function variant(k){state.variant=k;const u=new URL(location);u.searchParams.set('variant',k);history.replaceState({},'',u);render()}
function cycle(n){const keys=Object.keys(variants);variant(keys[(keys.indexOf(state.variant)+n+keys.length)%keys.length])}
let toastTimer;function toast(s){$('#toast').innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').innerHTML='',3500)}
function modal(html){$('#overlay').innerHTML=`<div class="scrim"><section class="modal" role="dialog" aria-modal="true"><div class="modal-title"><span class="upper dim">Simulation / 演示</span><button class="icon" data-action="close" aria-label="关闭对话框">×</button></div>${html}</section></div>`;$('#overlay button')?.focus()}
function advice(){const b=state.boundary;if(!b.complete)return ['尚未进入阶段交接','先明确当前工作是否已完成。一次停止输出不能证明阶段结束。'];if(b.primary||b.room==='yes')return ['Continue','下一工作需要当前原始推理，或还有足够余量。先保留当前上下文。'];if(b.irrelevant)return ['Clear','你声明当前上下文与下一工作无关。先确认 retro 和所需证据已保存。'];if(b.portable)return ['Handoff','需要换目录、harness 或移交给别人。保存原始工件指针，并写便携交接文档。'];if(b.afk)return ['Subagent','下一项工作足够明确，可以在独立上下文完成并返回带来源的报告。'];return ['Compact','上下文仍相关，继续在当前环境工作。明确摘要要保留的依据。']}
function boundary(){const b=state.boundary,[name,reason]=advice();const yn=(key,label)=>`<label class="question"><span>${label}</span><select data-boundary="${key}"><option value="yes" ${b[key]===true?'selected':''}>是</option><option value="no" ${b[key]===false?'selected':''}>否</option></select></label>`;modal(`<h2 style="margin-top:14px">在交接处，做一次判断</h2><p>当前阶段 ${state.phase} · ticket ${state.ticket}。按 Matt 的顺序考虑；这里只生成建议。</p>${yn('complete','当前这一段工作已完成了吗？')}${yn('primary','下一工作需要当前原始推理吗？')}<label class="question"><span>下一工作能装进剩余上下文吗？</span><select data-boundary="room">${[['unknown','未知 · 没有遥测'],['yes','是 · 人工判断'],['no','否 · 人工判断']].map(([v,t])=>`<option value="${v}" ${b.room===v?'selected':''}>${t}</option>`).join('')}</select></label>${yn('irrelevant','当前上下文与下一工作无关吗？')}${yn('portable','需要换 harness、目录或移交吗？')}${yn('afk','下一工作足够明确，可 AFK 吗？')}<div class="recommendation"><strong>${name}</strong><p>${reason}</p></div><div class="row spread"><span class="tiny dim">上下文占用未知；不推测 token 余量。</span>${button('采用建议 · 仅模拟','adopt','primary')}</div>`)}
function newSession(){const t=current();modal(`<h2 style="margin-top:14px">${t.status==='active'?'已有关联会话':'新会话预览'}</h2><p>${t.status==='active'?'这项工作已有 Codex 会话，优先定位，不重复启动。':t.status==='blocked'?'前置工作尚未验收，暂不能开始。可先查看阻塞来源。':'以自包含的 ticket 和 spec 指针开始一个全新上下文。'}</p><pre>${esc(JSON.stringify({agent:'Codex',folder:'~/workspace/matt-herdr-layout',ticket:'.scratch/matt-workbench/issues/'+t.path,spec:'.scratch/matt-workbench/spec.md',blockers:t.blockers,status:t.status},null,2))}</pre><div class="note info">这是模拟请求，不会创建真实 tab、agent 或 worktree。</div><div class="row" style="justify-content:flex-end">${button('关闭','close')}${t.status==='blocked'?'':button(t.status==='active'?'定位 · 模拟':'创建新会话 · 模拟',t.status==='active'?'simulate-focus':'simulate-start','primary')}</div>`)}
function showSource(file){modal(`<h2 style="margin-top:14px">${esc(file||current().path)}</h2><p class="mono tiny">.scratch/matt-workbench/${file==='spec.md'?'':'issues/'}${esc(file||current().path)}</p><pre>${esc(file==='spec.md'?'# Matt workbench spec（演示）\n\n让当前工作、可开始工作和原始依据清晰可见。\n\n- tracker 是任务状态来源\n- Herdr 是运行与注意力状态来源\n- review 报告固定在具体 revision\n- 切换视图不重建 terminal':`# ${current().id}: ${current().name}\n\n**Status:** ${current().status}\n**Blocked by:** ${current().blockers.join(', ')||'None'}\n\n- [x] 显示原始状态与来源\n- [x] 未知依赖不进入 ready\n- [ ] agent done 不改变 ticket 状态\n\n演示约定：complete = 已验收。\n此内容不对应真实 tracker 文件。`)}</pre>${button('关闭','close')}`)}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.variant){variant(el.dataset.variant);return}if(el.dataset.cycle){cycle(Number(el.dataset.cycle));return}if(el.dataset.phase){state.phase=el.dataset.phase;render();toast(`视图切换为 ${state.phase}；模拟 terminal t-demo-03 保留`);return}if(el.dataset.ticket){state.ticket=el.dataset.ticket;state.panel='detail';render();if(state.variant==='C' && state.ticket!=='03')newSession();return}if(el.dataset.panel){state.panel=el.dataset.panel;render();return}if(el.dataset.file){showSource(el.dataset.file);return}const a=el.dataset.action;switch(a){case 'state':state.drawer=!state.drawer;render();break;case 'boundary':boundary();break;case 'adopt':{const [n]=advice();if(!state.boundary.complete){toast('先确认当前工作已完成，再决定交接方式。');break}$('#overlay').innerHTML='';toast(`已记录建议：${n}。没有发送命令。`);break}case 'close':$('#overlay').innerHTML='';break;case 'artifact':state.panel='artifact';if(state.variant==='A'){state.rightOpen=true;render()}else showSource('spec.md');break;case 'source':showSource();break;case 'evidence':modal(`<h2 style="margin-top:15px">验证证据 · 演示</h2><p>测试 2 项通过；Standards 1 项建议；Spec 未提供。此 ticket 仍未完整验收。</p><div class="note">${state.evidence==='stale'?'head 已变化，报告过期。':'报告固定于 b83e119。'}</div>${button('模拟代码变化','stale')}`);break;case 'stale':state.evidence='stale';$('#overlay').innerHTML='';render();toast('模拟 head 改变：原报告已过期，ticket 状态不变。');break;case 'agent-done':state.agent=state.agent==='working'?'done':state.agent==='done'?'idle':'working';render();toast(`Agent → ${state.agent}；tracker 03 仍为 active，05 仍被阻塞。`);break;case 'new-session':newSession();break;case 'simulate-start':state.started.push(state.ticket);$('#overlay').innerHTML='';render();toast(`模拟启动请求已记录：ticket ${state.ticket}；未创建真实进程。`);break;case 'simulate-focus':case 'focus':$('#overlay').innerHTML='';toast('已定位演示终端 t-demo-03；没有操作真实 Herdr。');break;case 'panel-toggle':state.rightOpen=!state.rightOpen;render();break;case 'all-work':variant('B');break;case 'reviewer':state.phase='Review';render();toast('展示双轴审阅视图，原模拟终端保留。');break;case 'offline':toast('omarchy 失联；状态未知，不视为空任务或成功。');break;case 'other-space':toast('原型只包含 matt-workbench 这一组演示数据。');break;case 'home':state.ticket='03';state.phase='Build';render();break;case 'help':modal('<h2 style="margin-top:15px">工作台原型 · 四种结构</h2><p>A：终端优先，右侧常驻任务和工件。<br>B：任务依赖优先，下方观察选中会话。<br>C：单会话聚焦，侧栏保留待处理队列。<br>D：固定对话入口，独立事件与可选角色配置。</p><p>用底部按钮或左右方向键切换。点击 ticket、阶段和交接入口，体验布局与信息层级。所有变更只在当前页面内存中。</p>'+button('开始比较','close','primary'));break}});

<script id="parallel-prototype">
(()=>{
const initial=()=>({selected:'A',view:matchMedia('(max-width:620px)').matches?'list':'graph',focus:false,inspect:false,head:'b83e119',verifiedHead:'b83e119',merged:[],conflict:null,step:0,answer:null,logs:['已从 b83e119 启动 A、B：独立会话、worktree 与分支。'],workers:{A:{id:'A',ticket:'03',name:'可开始任务集合',agent:'Codex',address:'t-demo-a',branch:'ticket/03-frontier',worktree:'.worktrees/03-frontier',base:'b83e119',runtime:'working',result:null,phase:'TDD'},B:{id:'B',ticket:'04',name:'阶段与上下文标注',agent:'Claude Code',address:'t-demo-b',branch:'ticket/04-phase',worktree:'.worktrees/04-phase',base:'b83e119',runtime:'working',result:null,phase:'TDD'},C:{id:'C',ticket:'05',name:'从任务进入新会话',agent:'—',address:null,branch:null,worktree:null,base:null,runtime:'not_started',result:null,phase:'等待 A + B'},M:{id:'M',ticket:'merge',name:'集成与验证',agent:'Merger',address:'t-demo-merger',branch:'integration/matt-workbench',worktree:'.worktrees/integration',base:'b83e119',runtime:'idle',result:null,phase:'等待结果'}}});
let sim=initial();
const get=id=>sim.workers[id],currentHeadVerified=()=>sim.head===sim.verifiedHead,readyC=()=>['A','B'].every(id=>sim.merged.includes(id))&&currentHeadVerified()&&!sim.conflict;
const log=s=>sim.logs.unshift(s),selected=()=>get(sim.selected),status=id=>{const w=get(id);if(id==='M')return sim.conflict?'合并冲突':currentHeadVerified()?'当前 head 已验证':'集成验证待运行';if(id==='C'&&w.runtime==='not_started')return readyC()?'可开始':'等待 A + B';if(sim.merged.includes(id))return currentHeadVerified()?'已集成 · 已验证':'已合入 · 待验证';if(w.result)return sim.conflict===id?'合并冲突':'已产出 · 待集成';if(w.runtime==='blocked')return '需要你回答';return '正在实现';};
const color=id=>{const s=status(id);return s.includes('等待')?'dim':s.includes('冲突')||s.includes('回答')||s.includes('待')?'orange':'green';};
const pending=()=>['A','B'].filter(id=>get(id).result&&!sim.merged.includes(id));
function attentionRows(){const rows=[];if(get('B').runtime==='blocked')rows.push({id:'B',text:'B 等你判断缺失上下文的显示方式'});if(sim.conflict)rows.push({id:sim.conflict,text:sim.conflict+' 合并冲突，需要处理'});for(const id of pending())if(sim.conflict!==id)rows.push({id,text:id+' 已产出，等待 merger 集成'});if(!currentHeadVerified()&&!sim.conflict)rows.push({id:'M',text:'当前 integration head 尚未验证'});return rows;}
function snapshot(){return {question:'并行开发时，任务、注意力和集成结果能否同时清楚？',selected:sim.selected,view:sim.view,focus:sim.focus,head:sim.head,verifiedHead:sim.verifiedHead,merged:[...sim.merged],frontier:readyC()&&get('C').runtime==='not_started'?['05']:[],attention:attentionRows().map(r=>r.text),workers:sim.workers,latest:sim.logs[0]};}
function sync(){state.parallel=snapshot();}
function act(type,id){const w=get(id||sim.selected);switch(type){
case 'finish':if(!['A','B'].includes(w.id)||w.runtime!=='working'||w.result)break;w.result=w.id==='A'?'c03aa71':'c04bb82';w.runtime='done';w.phase='待集成';log(w.id+' 已返回提交 '+w.result+'；尚未合入 integration，依赖不放行。');break;
case 'block':if(get('B').result)break;get('B').runtime='blocked';get('B').phase='等待判断';log('B 需要人判断：没有 token 遥测时，显示未知还是估算？');break;
case 'answer':if(get('B').runtime!=='blocked')break;sim.answer='显示未知，不估算';get('B').runtime='working';get('B').phase='TDD';log('已回答 B：上下文显示未知；B 继续原会话。');break;
case 'merge':if(!w.result||sim.merged.includes(w.id)||sim.conflict)break;sim.merged.push(w.id);sim.head=w.id==='A'?'m03a921':'m04b137';get('M').runtime='working';get('M').phase='等待验证';log('Merger 已将 '+w.id+' 合入 '+sim.head+'；旧 head 验证不再代表当前 head。');break;
case 'verify':if(sim.conflict||currentHeadVerified())break;sim.verifiedHead=sim.head;get('M').runtime='idle';get('M').phase='已验证';log('集成测试通过 @ '+sim.head+'。'+(readyC()?' A+B 均已集成，C 进入可开始集合。':' B 尚未集成，C 继续等待。'));break;
case 'conflict':if(!w.result||sim.merged.includes(w.id))break;sim.conflict=w.id;get('M').runtime='blocked';get('M').phase='合并冲突';log('模拟 '+w.id+' 的合并冲突；integration head 保持 '+sim.head+'，C 不放行。');break;
case 'resolve':if(!sim.conflict)break;log('已模拟解决 '+sim.conflict+' 的冲突；仍需重新合入与验证。');sim.conflict=null;get('M').runtime='idle';get('M').phase='待集成';break;
case 'start':if(!readyC()||get('C').runtime!=='not_started')break;Object.assign(get('C'),{agent:'Codex',address:'t-demo-c',branch:'ticket/05-session',worktree:'.worktrees/05-session',base:sim.head,runtime:'working',phase:'TDD'});log('C 已在全新上下文启动，基线 '+sim.head+'；A、B 会话保留。');break;
case 'seen':if(w.runtime==='done'){w.runtime='idle';log(w.id+' 的 done 通知已查看 → idle；提交和集成状态不变。');}break;
}
sync();render();}
function nextStep(){if(sim.conflict)return ['处理合并冲突','resolve',sim.conflict];if(!get('A').result)return ['A 完成，B 等待回答','first','A'];if(get('B').runtime==='blocked')return ['回答 B：显示未知','answer','B'];if(!sim.merged.includes('A'))return ['让 merger 合入 A','merge','A'];if(!currentHeadVerified())return ['验证当前集成 head','verify','M'];if(!get('B').result)return ['B 完成并返回提交','finish','B'];if(!sim.merged.includes('B'))return ['让 merger 合入 B','merge','B'];if(get('C').runtime==='not_started')return ['从新基线启动 C','start','C'];return ['重新演练','reset','A'];}
function node(id,x,y){const w=get(id),sel=sim.selected===id,c=color(id),stroke=sel?'#b5d3bd':c==='green'?'#567b62':c==='orange'?'#8a704a':'#3c4552',fill=sel?'#25372b':'#1c222a';return `<g class="node" data-pselect="${id}" role="button" tabindex="0" aria-label="查看 ${id} ${w.name}"><rect x="${x}" y="${y}" width="170" height="82" rx="8" fill="${fill}" stroke="${stroke}"/><text x="${x+13}" y="${y+21}" fill="#84928a" font-size="10">${id} · TICKET ${w.ticket}</text><text x="${x+13}" y="${y+43}" fill="#e1e7e2" font-size="12">${w.name}</text><circle cx="${x+16}" cy="${y+63}" r="3" fill="${c==='green'?'#a5cdb0':c==='orange'?'#e8b87b':'#677181'}"/><text x="${x+25}" y="${y+67}" fill="${c==='green'?'#a5cdb0':c==='orange'?'#e8b87b':'#8b95a3'}" font-size="10">${status(id)}</text></g>`;}
function graph(){return `<div class="p-graph"><div class="p-sectionbar"><span class="row"><strong>任务依赖</strong><span class="dim">02 基础工件已验收 · 演示约定</span></span><div class="row"><button class="tiny ${sim.view==='graph'?'green':'dim'}" data-paction="graph">依赖图</button><button class="tiny ${sim.view==='list'?'green':'dim'}" data-paction="list">列表</button></div></div><div class="p-graph-content">${sim.view==='graph'?`<svg class="p-map" viewBox="0 0 590 285" aria-label="A 与 B 并行，C 依赖 A 和 B"><defs><marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7c70"/></marker></defs><text x="25" y="19" fill="#677181" font-size="10">并行实现 · 各自独立上下文</text><text x="385" y="19" fill="#677181" font-size="10">依赖满足后才可开始</text><path class="edge ${sim.merged.includes('A')&&currentHeadVerified()?'met':get('A').result?'pending':''}" d="M 195 89 C 275 89 288 142 375 142" marker-end="url(#p-arrow)"/><path class="edge ${sim.merged.includes('B')&&currentHeadVerified()?'met':get('B').result?'pending':''}" d="M 195 211 C 275 211 288 142 375 142" marker-end="url(#p-arrow)"/>${node('A',25,48)}${node('B',25,170)}${node('C',375,101)}<text x="228" y="254" fill="#829187" font-size="10">边满足 = 已集成 + 当前 head 验证通过</text></svg>`:`<div class="p-list">${['A','B','C'].map(id=>`<button class="ticket ${sim.selected===id?'selected':''}" data-pselect="${id}"><div class="row spread"><span class="mono tiny dim">${id} / ${get(id).ticket}</span><span class="${color(id)} tiny">${status(id)}</span></div><div class="ticket-title">${get(id).name}</div><div class="tiny dim">${get(id).branch||'等待新会话'} · ${get(id).runtime}</div></button>`).join('')}</div>`}</div><div class="p-legend"><span><i class="dot green"></i>实现 / 已验证</span><span><i class="dot orange"></i>需处理 / 待集成</span><span><i class="dot dim"></i>等待依赖</span><span class="grow"></span><span>点选节点查看工作，原会话保留</span></div></div>`;}
function workerSide(){const rows=attentionRows();return `<aside class="parallel-side"><div class="side-head"><div class="upper muted">Effort / Build</div><h3 style="margin-top:11px">matt-workbench</h3><div class="p-context">调度者：implement-spec<br>Herdr：展示与人工入口 · 模拟</div></div><div class="side-head row spread"><span class="upper muted">需要你</span>${badge(rows.length,'orange')}</div>${rows.length?rows.map(r=>`<button class="attention" data-pselect="${r.id}">${r.text} ↗</button>`).join(''):'<div class="tiny dim p-section-label" style="padding:0 7px 15px">暂无阻塞，可以继续观察。</div>'}<div class="side-head upper muted" style="margin-top:20px">Workers / 3 + merger</div>${['A','B','C','M'].map(id=>{const w=get(id);return `<button class="p-worker ${sim.selected===id?'selected':''}" data-pselect="${id}"><div class="row"><span class="avatar">${id==='M'?'⑂':id}</span><strong class="grow">${w.agent==='—'?'待启动':w.agent}</strong><i class="dot ${color(id)}"></i></div><div class="worker-sub">${id==='M'?'Integration':w.ticket+' · '+w.name}</div><div class="worker-sub ${color(id)}">${status(id)}</div></button>`}).join('')}<div class="side-bottom"><div class="tiny muted">每个 worker 独立 worktree</div><div class="tiny dim" style="margin-top:7px">上下文用量：分别未知</div></div></aside>`;}
function term(){const w=selected();let body='';if(w.id==='M'){body=`<p><span class="green">❯</span> merger / integration/matt-workbench</p><p>当前 head <span class="blue">${sim.head}</span> · ${status('M')}</p><div class="code">${sim.conflict?`<span class="orange">CONFLICT</span> ${sim.conflict} 尚未合入；保持原 head。`:sim.merged.length?sim.merged.map(id=>`MERGED ${id} / ${get(id).result}`).join('<br>'):'等待 worker 返回提交。'}<br>${currentHeadVerified()?'<span class="green">PASS</span> 当前 head 集成测试通过':'<span class="orange">PENDING</span> 当前 head 需重新验证'}</div>`;}
else if(w.id==='C'&&w.runtime==='not_started'){body=`<p><span class="dim">○</span> 还没有 C 的终端</p><p>${readyC()?'A、B 已集成且当前 head 已验证。可以启动新上下文。':'C 的前置工作是 A + B。agent 停止输出不会满足依赖。'}</p><div class="code">A · ${status('A')}<br>B · ${status('B')}<br>integration · ${sim.head} / ${currentHeadVerified()?'已验证':'待验证'}</div>`;}
else if(w.runtime==='blocked'){body=`<p><span class="orange">❯ 等待人判断</span> · ${w.address}</p><div class="prompt">无法读取当前上下文 token 时，阶段条应该显示什么？</div><p class="muted">推荐：显示「未知」，避免从累计计费用量推测余量。</p><div class="p-inline-answer"><span class="grow">这一决定只回答 B，其他 worker 继续运行。</span><button class="btn primary" data-paction="answer">显示未知，继续</button></div>`;}
else if(w.result){body=`<p><span class="green">● ${w.id} 已返回结果</span> · ${w.result}</p><p>本地行为切片验证通过（演示）。工作结果进入待集成队列。</p><div class="code">worktree  ${w.worktree}<br>branch    ${w.branch}<br>result    ${w.result}<br>integration ${sim.merged.includes(w.id)?sim.head:'尚未合入'}</div><p class="dim">运行状态 ${w.runtime}；即使通知已看过变为 idle，结果仍保留。</p>`;}
else body=`<p><span class="green">❯</span> /implement ticket ${w.ticket} · ${w.address}</p><p>正在实现：${w.name}</p><div class="code"><span class="green">PASS</span> 行为切片 1 · 演示<br><span class="orange">NEXT</span> 验证切片 2，再返回提交<br>base      ${w.base}</div><p class="dim">同一 Effort 的其他 worker 在各自上下文工作。</p>`;
return `<div class="p-terminal"><section class="terminal"><div class="terminal-head"><span class="avatar" style="width:20px;height:20px;font-size:10px">${w.id}</span><span>${w.address||'尚无终端'}</span><span class="dim mono">· ${w.agent}</span><span class="grow"></span><span class="${color(w.id)} tiny">${w.runtime}</span>${w.runtime==='done'?'<button class="tiny blue" data-paction="seen">标为已查看</button>':''}<button class="icon" data-paction="focus">${sim.focus?'↙':'↗'}</button></div><div class="terminal-body">${body}</div></section></div>`;}
function inspectorP(){const w=selected();let actions='';if(w.id==='M'){actions=sim.conflict?'<button class="btn primary" data-paction="resolve">模拟解决冲突</button>':!currentHeadVerified()?'<button class="btn primary" data-paction="verify">验证当前 head</button>':'';}else if(w.runtime==='blocked')actions='<button class="btn primary" data-paction="answer">回答：显示未知</button>';else if(w.id==='C'&&w.runtime==='not_started')actions=readyC()?'<button class="btn primary" data-paction="start">新上下文启动 C</button>':'<button class="btn" disabled>等待 A + B 验收</button>';else if(sim.conflict===w.id)actions='<button class="btn primary" data-paction="resolve">模拟解决冲突</button>';else if(w.result&&!sim.merged.includes(w.id))actions=`<button class="btn primary" data-paction="merge" ${sim.conflict?'disabled':''}>交给 merger 合入</button><button class="btn" data-paction="conflict">模拟冲突</button>`;else if(sim.merged.includes(w.id)&&!currentHeadVerified())actions='<button class="btn primary" data-paction="verify">验证当前 head</button>';else if(!w.result&&['A','B'].includes(w.id))actions='<button class="btn" data-paction="finish">模拟 worker 完成</button>';
return `<aside class="p-inspector"><div class="p-sectionbar"><span>选中工作 / ${w.id}</span><button class="tiny dim" data-paction="focus">${sim.focus?'回到总览 ↙':'聚焦终端 ↗'}</button></div><div class="panel-content"><div class="row spread"><span class="mono tiny dim">${w.id==='M'?'INTEGRATION':'TICKET '+w.ticket}</span>${badge(w.phase,color(w.id))}</div><h2 class="detail-title">${w.name}</h2><div class="data-row"><span class="dim">运行 / 注意力</span><span>${w.runtime}</span></div><div class="data-row"><span class="dim">工作结果</span><span class="${color(w.id)}">${status(w.id)}</span></div><div class="data-row"><span class="dim">基线</span><span class="mono">${w.base||'启动时确定'}</span></div><div class="data-row"><span class="dim">提交</span><span class="mono">${w.result||'尚未返回'}</span></div><div class="p-actions">${actions}</div><div class="section-title">Context pointers</div><div class="filename muted" style="line-height:1.9;font-size:10px">${w.worktree||'尚未创建 worktree'}<br>${w.branch||'尚未创建 branch'}</div><button class="tiny blue" style="margin-top:11px" data-paction="source">spec / ticket / commit ↗</button><div class="note ${readyC()?'success':'info'}">${readyC()?'当前基线可供 C 使用。启动时传 ticket 与 spec 指针，保持新上下文。':'任务完成、成果合入、当前 head 验证是不同信息。C 等待有效的共同基线。'}</div><div class="section-title merge-log-title"><span>活动记录</span><span class="dim">仅本次演示</span></div><div class="p-log">${sim.logs.slice(0,5).map((l,i)=>`<p><span class="dim">${i?'·':'刚刚'}</span> ${esc(l)}</p>`).join('')}</div></div></aside>`;}
function parallelView(){sync();const next=nextStep(),ready=readyC()&&get('C').runtime==='not_started';return `${workerSide()}<main class="p-main"><div class="integration-bar"><span class="integration-name">⑂ integration/matt-workbench</span><span class="mono tiny blue">${sim.head}</span>${badge(currentHeadVerified()?'✓ 当前 head 已验证':'△ 当前 head 待验证',currentHeadVerified()?'green':'orange')}<span class="grow"></span><span class="tiny dim context">最终 review：全分支 · 尚未运行</span><button class="btn" data-pselect="M">查看集成</button></div><header class="p-head"><div class="grow"><div class="upper dim" style="margin-bottom:8px">Parallel build / implement-spec</div><h1>${sim.focus?'聚焦 '+selected().id+' · '+selected().name:'多条工作线，一个集成基线'}</h1><p>${sim.focus?'只展开选中会话；其他 worker 继续保留。':'A 与 B 并行；C 等待两者集成并验证。'} <span class="green">${ready?'C 已可开始。':''}</span></p></div><div class="p-stat">${['A','B','C'].filter(id=>get(id).runtime==='working'&&!get(id).result).length} running · ${pending().length} pending · ${ready?1:0} ready</div><button class="btn p-mobile-button" data-paction="inspect">详情 ☷</button><button class="btn" data-paction="focus">${sim.focus?'返回总览':'聚焦选中'}</button></header><div class="p-canvas ${sim.focus?'p-focus':''} ${sim.inspect?'inspect-open':''}"><div class="p-center">${graph()}${term()}</div>${inspectorP()}</div><div class="walkthrough"><div class="grow"><h3>演练：完成结果，如何变成下一项工作的起点？</h3><p>${esc(sim.logs[0])}</p></div><button class="p-reset" data-paction="reset">重置</button><button class="btn primary" data-paction="next">${next[0]} →</button></div></main>`;}
VariantB=parallelView;variants.B='并行协调台';
const oldSwitcher=PrototypeSwitcher;PrototypeSwitcher=function(){if(state.variant!=='B')return oldSwitcher();const base=oldSwitcher();return base.replace(/<div class="state-readout">[\s\S]*?<\/div>/,`<div class="state-readout p-readout">selected=${sim.selected} · head=${sim.head} · verified=${sim.verifiedHead} · merged=${sim.merged.join('+')||'none'} · C=${get('C').runtime==='working'?'running':readyC()?'ready':'blocked'}</div>`);};
document.addEventListener('click',e=>{const target=e.target.closest('[data-paction],[data-pselect]');if(!target)return;if(target.dataset.pselect){sim.selected=target.dataset.pselect;sync();render();return;}const a=target.dataset.paction;if(a==='reset'){sim=initial();sync();render();return}if(a==='next'){const [,type,id]=nextStep();if(type==='first'){act('finish','A');act('block','B');sim.selected='B';sync();render();}else if(type==='reset'){sim=initial();sync();render()}else{sim.selected=id;act(type,id)}return;}if(a==='focus'){sim.focus=!sim.focus;sync();render();return}if(a==='inspect'){sim.inspect=!sim.inspect;sync();render();return}if(a==='graph'||a==='list'){sim.view=a;sync();render();return}if(a==='source'){const w=selected();modal(`<h2 style="margin-top:15px">${w.id} 的上下文指针</h2><p>模拟来源，不读取真实文件。</p><pre>${esc(JSON.stringify({spec:'.scratch/matt-workbench/spec.md',ticket:w.ticket,worktree:w.worktree,branch:w.branch,base:w.base,commit:w.result,integrationHead:sim.head,verifiedHead:sim.verifiedHead},null,2))}</pre>${button('关闭','close')}`);return;}act(a);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target instanceof Element&&e.target.closest('[data-pselect]')){e.preventDefault();e.target.closest('[data-pselect]').dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.parallelDemo={snapshot,action:act,reset:()=>{sim=initial();sync();render()},select:id=>{sim.selected=id;sync();render()}};
if(!new URLSearchParams(location.search).has('variant'))state.variant='B';sync();render();
})();

<script id="dialogue-prototype">
(function(){

const roles=[['dialogue','专门对话','理解意图、解释状态与转译诉求'],['cos','CoS 调度','唯一执行协调入口'],['worker','开发 Worker','自包含 ticket 的实现'],['review','独立评审','固定版本，核对标准与 spec'],['merge','集成 Merger','串行集成与验证']];
const cfg=(runner,model,effort='medium')=>({runner,model,effort});
const balanced=()=>({dialogue:cfg('Claude Code','claude-opus-5-5'),cos:cfg('Codex','gpt-6.1-sol'),worker:cfg('Codex','gpt-6.1-sol'),review:cfg('Claude Code','claude-opus-5-5','high'),merge:cfg('Codex','gpt-6.1-sol')});
const clone=x=>JSON.parse(JSON.stringify(x)), same=(a,b)=>JSON.stringify(a)===JSON.stringify(b), label=c=>(catalog[c.runner].find(m=>m[0]===c.model)||[null,c.model])[1], fmt=c=>c.runner+' · '+label(c)+' · '+c.effort;
const initial=()=>{const defaults=balanced();return {page:'chat',pane:'work',inspect:false,scope:'effort',defaults,edits:clone(defaults),override:null,overrideEdit:clone(defaults.worker),dirty:false,configMessage:'',draft:'',messages:[{type:'assistant',text:'A 与 B 正在并行实现，C 等待共同集成基线。你可以在这里补充要求、纠正方向或讨论验收。我会把诉求交给 CoS，并单独跟踪执行回执。'}],events:[],eventCount:0,receipt:null,selected:'B',actualDialogue:clone(defaults.dialogue),workers:{A:{id:'A',title:'Frontier 视图',status:'working',run:'run-A-01',config:clone(defaults.worker),revision:'a83e119'},B:{id:'B',title:'阶段条与上下文',status:'working',run:'run-B-01',config:clone(defaults.worker),revision:'b83e119'},C:{id:'C',title:'会话定位入口',status:'not_started',run:null,config:null,revision:null}},history:[],scenario:'notify',step:0,last:'配置能力与所有结果均为演示；未连接真实运行器。'};};
let d=initial();
function snapshot(){return clone(d)}
function sync(){state.dialogue=snapshot()}
const desired=()=>d.override||d.defaults.worker;
function add(text,type='assistant'){d.messages.push({type,text})}
function event(title,source='CoS',detail='后台事件单独保存，不注入用户输入。'){d.eventCount++;d.events.unshift({id:'E'+d.eventCount,title,source,detail,seen:false});d.last=title;}
function redraw(){const el=document.activeElement,sel=el&&el.id,range=el&&typeof el.selectionStart==='number'?[el.selectionStart,el.selectionEnd]:null,scroll=document.querySelector('.d-messages')?.scrollTop;sync();render();if(sel){const next=document.getElementById(sel);if(next){next.focus({preventScroll:true});if(range&&next.setSelectionRange)next.setSelectionRange(...range)}}if(scroll!==undefined&&document.querySelector('.d-messages'))document.querySelector('.d-messages').scrollTop=scroll;}
function openConfig(scope='effort'){d.page='roles';d.scope=scope;d.edits=clone(d.defaults);d.overrideEdit=clone(desired());d.dirty=false;d.configMessage='';redraw()}
function act(a){const b=d.workers.B;switch(a){
case 'notify':event('A 返回提交；等待集成','Worker A','完成事件不会表示人工验收通过。');d.workers.A.status='result_ready';break;
case 'notify-batch':d.workers.A.status='result_ready';event('A 返回提交；等待集成','Worker A');event('B 的验证报告已更新','Worker B');event('集成队列有 1 项待处理','CoS');break;
case 'summarize':{const pending=d.events.filter(e=>!e.seen);if(!pending.length)break;add('我已读取 '+pending.map(e=>e.id).join('、')+'：'+pending.map(e=>e.title).join('；')+'。用户草稿保留，完成通知未作为验收结论。','system');pending.forEach(e=>e.seen=true);d.last='事件在独立的汇总步骤进入对话，来源编号保留。';break;}
case 'send':{const text=d.draft.trim();if(!text)break;add(text,'user');d.draft='';if(/暂停|停下/.test(text)&&/B/i.test(text)){requestPause()}else add('已记录这条用户消息。自由输入只演示消息边界；本原型不会推断并执行任意操作。可使用右侧的明确操作演练暂停与交接。');break;}
case 'pause':requestPause();break;
case 'pause-ack':if(!d.receipt||d.receipt.status!=='requested')break;b.status='paused';d.receipt.status='paused';event('B 已确认暂停','CoS','A 的进度保留；B 的已执行变更尚未回滚。');add('CoS 已确认 B 暂停。A 的工作保留；B 的现场仍在原会话中。','system');d.last='暂停已确认，尚未切换 Agent。';break;
case 'save':{const values=d.scope==='effort'?Object.values(d.edits):[d.overrideEdit];if(values.some(c=>c.model==='claude-fable-5-1')){d.configMessage='演示账号不支持 Fable；未保存，也未自动替换模型。';break;}if(d.scope==='effort')d.defaults=clone(d.edits);else d.override=clone(d.overrideEdit);d.dirty=false;d.configMessage='已保存到本页内存。当前会话保持原配置；仅后续启动使用新配置。';d.last='期望配置已更新，B 实际仍为 '+fmt(b.config);break;}
case 'clear-override':d.override=null;d.overrideEdit=clone(d.defaults.worker);d.dirty=false;d.configMessage='已移除 B 的覆盖；当前 B 会话保持原配置。';break;
case 'launch':if(d.workers.C.status!=='not_started')break;Object.assign(d.workers.C,{status:'working',run:'run-C-01',config:clone(d.defaults.worker),revision:'m04b137'});event('C 按当前 effort 默认配置启动','CoS','模拟：假定 A+B 已集成且共同基线已验证 @ m04b137。');d.last='C 使用新默认；B 原会话仍在。';break;
case 'handoff':if(b.status!=='paused'||same(b.config,desired())||desired().model==='claude-fable-5-1')break;d.history.push(clone(b));const old=b.run;b.run='run-B-0'+(d.history.length+1);b.config=clone(desired());b.status='working';d.receipt.status='handed_off';d.receipt.toRun=b.run;event('B 已交接到 '+b.run,'CoS','保留目标、未知不估算约束、现场 b83e119、请求 R17 与事件进度。');add('模拟交接完成：'+old+' 保留为暂停现场，新会话 '+b.run+' 使用 '+fmt(b.config)+'。','system');d.last='新会话显式接手；旧运行没有被覆盖。';break;
case 'chat':d.page='chat';break;
case 'roles':openConfig();return;
case 'scope-b':openConfig('ticketB');return;
case 'inbox':d.pane='events';d.inspect=true;break;
case 'work':d.pane='work';d.inspect=true;break;
case 'inspect':d.inspect=!d.inspect;break;
case 'fill':d.draft='先暂停 B，保留 A 的进度。未知数据不能估算。';d.last='已填入用户草稿；尚未发送。';break;
case 'preset-worker':d.defaults.worker=cfg('Claude Code','claude-sonnet-5-5');d.edits=clone(d.defaults);d.last='开发默认改为 Claude Code / Sonnet 5.5；B 仍为 Codex。';break;
case 'reset':d=initial();break;
}redraw();}
function requestPause(){if(d.workers.B.status!=='working'||d.receipt)return;d.receipt={id:'R17',target:'B',run:d.workers.B.run,status:'requested',constraint:'未知数据不估算',preserve:'A 继续，保留已有现场'};add('已向 CoS 发出 R17：暂停 B，保留 A 的进度，并约束未知数据不估算。现在是“已请求”，尚未确认 B 停下。');d.last='R17 等待暂停确认；不能立即显示为已暂停。';}
const scenarios={notify:{title:'输入与通知',desc:'先填入草稿，再让后台事件到达。观察输入和焦点。',steps:[['填入用户草稿','fill'],['模拟 3 条后台通知','notify-batch'],['汇总事件，保留草稿','summarize']]},config:{title:'默认与实际',desc:'改变默认配置，再启动下一项。当前 B 不应被改变。',steps:[['修改开发默认为 Claude','preset-worker'],['按新默认启动 C','launch']]},handoff:{title:'暂停与交接',desc:'为 B 改选 Claude；请求暂停、确认暂停后才启动新会话。',steps:[['设定新开发配置','preset-worker'],['请求暂停 B','pause'],['模拟 CoS 确认暂停','pause-ack'],['交接到新会话','handoff']]}};
function guide(){if(d.page==='roles')return `<div class="d-lab"><div class="grow"><div class="tiny green">配置边界</div><p>保存期望配置后，回到工作区比较实际运行。跨运行器切换需要明确交接。</p></div><button class="btn" data-daction="chat">查看实际运行 →</button></div>`;const s=scenarios[d.scenario],step=s.steps[d.step];return `<div class="d-lab"><div class="grow"><div class="tiny green">演练 ${d.step}/${s.steps.length} · ${s.title}</div><p>${esc(d.last)}</p></div><button class="tiny muted" data-daction="reset">重置</button><button class="btn primary" data-daction="next">${step?step[0]+' →':'重新演练 ↺'}</button></div>`}
function sidebarD(){return `<aside class="d-nav"><div class="upper dim" style="padding:0 8px">Effort / Build</div><h2>matt-workbench</h2><button class="side-item ${d.page==='chat'?'active':''}" data-daction="chat">◉ <span>对话中枢</span></button><button class="side-item ${d.page==='roles'?'active':''}" data-daction="roles">⚙ <span>角色与模型</span></button><button class="side-item" data-daction="inbox">▤ <span>事件收件箱</span><span class="count">${d.events.filter(e=>!e.seen).length}</span></button><div class="side-gap"></div><div class="side-head upper dim">Execution</div>${roles.slice(1).map(([k,n])=>`<div style="padding:7px 10px"><div class="tiny muted">${n}</div><div class="d-disclosure">${esc(label(d.defaults[k]))} · ${d.defaults[k].effort}<br>后续启动默认</div></div>`).join('')}<div class="side-bottom">模拟能力目录 · 研究快照<br>2026-11-04<br>不连接真实运行器</div></aside>`}
function requestCard(){const r=d.receipt;return r?`<div class="d-receipt"><strong>${r.id} → B</strong><br><span class="orange">${({requested:'已请求暂停 · 等待确认',paused:'已确认暂停 · 等待后续',handed_off:'已交接新会话'})[r.status]}</span><br><span class="dim">原运行 ${r.run}</span>${r.toRun?'<br>新运行 '+r.toRun:''}</div>`:''}
function inspectorD(){const b=d.workers.B;return `<aside class="d-inspect"><div class="d-pane-switch"><button class="${d.pane==='work'?'active':''}" data-daction="work">工作与回执</button><button class="${d.pane==='events'?'active':''}" data-daction="inbox">事件 ${d.events.filter(e=>!e.seen).length}</button></div>${d.pane==='events'?`<h2>事件收件箱</h2><p class="d-small" style="margin-top:9px">后台事件独立排队；不会进入正在编辑的用户消息。</p><div class="d-actions"><button class="btn" data-daction="notify">模拟 A 完成</button><button class="btn" data-daction="summarize" ${d.events.every(e=>e.seen)?'disabled':''}>让对话 Agent 汇总</button></div>${d.events.length?d.events.map(e=>`<div class="d-event"><span class="${e.seen?'dim':'green'}">${e.seen?'已汇总':'未读'} · ${e.id}</span><br>${esc(e.title)}<small>来源 ${esc(e.source)}<br>${esc(e.detail)}</small></div>`).join(''):'<div class="note info">暂时没有事件。可以在输入框写字，再模拟通知。</div>'}`:`<div class="upper dim">Parallel / 3 workers</div>${Object.values(d.workers).map(w=>`<div class="d-worker ${w.id==='B'?'selected':''}"><strong>${w.id} · ${w.title}</strong><span class="tiny ${w.status==='paused'?'orange':'green'}" style="float:right">${({working:'执行中',paused:'已暂停',not_started:'尚未开始',result_ready:'已产出'})[w.status]}</span><p>${w.config?esc(fmt(w.config)):'启动时采用 effort 默认'}<br>${w.run||'等待依赖与共同基线'}</p></div>`).join('')}<h3>B 的配置与操作</h3><div class="data-row"><span class="dim">期望配置</span><span>${esc(fmt(desired()))}</span></div><div class="data-row"><span class="dim">实际配置</span><span class="green">${esc(fmt(b.config))}</span></div><div class="data-row"><span class="dim">配置来源</span><span>${d.override?'B 单次任务覆盖':'当前 effort 默认'}</span></div><div class="d-actions"><button class="btn" data-daction="scope-b">覆盖 B 配置</button><button class="btn" data-daction="pause" ${b.status!=='working'||d.receipt?'disabled':''}>请求暂停 B</button><button class="btn" data-daction="pause-ack" ${d.receipt?.status!=='requested'?'disabled':''}>模拟确认暂停</button><button class="btn primary" data-daction="handoff" ${b.status!=='paused'||same(b.config,desired())?'disabled':''}>交接新会话</button></div>${requestCard()}<p class="d-small">暂停与交接均为手动模拟。旧会话和回执会保留，A 不受操作影响。</p><div class="d-actions"><button class="btn" data-daction="launch" ${d.workers.C.status!=='not_started'?'disabled':''}>模拟依赖满足，启动 C</button></div>`}</aside>`}
function chatD(){return `<div class="d-layout ${d.inspect?'d-show-inspect':''}"><section class="d-chat"><div class="d-chat-head"><span class="avatar">✳</span><strong>你的对话 Agent</strong><span class="muted">${esc(label(d.actualDialogue))} · ${d.actualDialogue.effort}</span><span class="grow"></span><span class="tiny dim">独立主会话 · front-01</span></div><div class="d-messages">${d.messages.map(m=>`<div class="d-msg ${m.type}"><div class="d-msg-label">${m.type==='user'?'你':m.type==='system'?'事件汇总 / 执行回执':'对话 Agent'}</div>${esc(m.text)}</div>`).join('')}<div class="d-disclosure">自由输入仅演示消息隔离；操作使用明确的演练按钮。所有回答均为预设模拟。</div></div><div class="d-composer"><div class="d-input-wrap"><textarea id="d-composer" aria-label="给对话 Agent 的消息" placeholder="在这里输入。后台通知到达时，草稿会保留。">${esc(d.draft)}</textarea><div class="d-compose-foot"><span class="d-composer-hint">${d.draft.length} 字 · 草稿与事件独立</span><button class="tiny blue" data-daction="fill">填入纠偏示例</button><span class="grow"></span><button class="btn primary" data-daction="send" ${!d.draft.trim()?'disabled':''}>发送 ↑</button></div></div></div></section>${inspectorD()}</div>`}
function configSelect(c,k,role){const data=`data-dfield="${k}" data-drole="${role}" id="d-${role}-${k}"`;const vals=k==='runner'?Object.keys(catalog).map(v=>[v,v]):k==='model'?catalog[c.runner]:['low','medium','high','xhigh','max'].map(v=>[v,v]);return `<select ${data} aria-label="${role} ${k}">${vals.map(([v,n])=>`<option value="${v}" ${c[k]===v?'selected':''} ${v==='claude-fable-5-1'?'disabled':''}>${esc(n)}</option>`).join('')}</select>`}
function configD(){const list=d.scope==='effort'?roles:roles.filter(([k])=>k==='worker');return `<section class="d-config"><div class="d-config-intro"><div class="grow"><h2>职责保持稳定，执行配置可以替换</h2><p>独立选择运行器、模型与思考强度。保存后只影响后续启动；现有会话显示实际配置。</p></div><label class="tiny muted">作用域 <select id="d-scope" aria-label="配置作用域"><option value="effort" ${d.scope==='effort'?'selected':''}>当前 effort 默认</option><option value="ticketB" ${d.scope==='ticketB'?'selected':''}>B · 单次任务覆盖</option></select></label></div><div class="note info">演示能力目录：Fable 在本模拟账号不可用。Max 可选；自动委派工作流不作为普通思考档位。工具与权限不随选型扩大。</div><div class="d-table-scroll"><table class="d-role-table"><thead><tr><th>角色 / 职责</th><th>运行器</th><th>模型</th><th>思考强度</th></tr></thead><tbody>${list.map(([k,n,desc])=>{const c=d.scope==='effort'?d.edits[k]:d.overrideEdit;return `<tr><td>${n}<small>${desc}</small></td><td>${configSelect(c,'runner',k)}</td><td>${configSelect(c,'model',k)}</td><td>${configSelect(c,'effort',k)}</td></tr>`}).join('')}</tbody></table></div><div class="d-config-footer"><button class="btn primary" data-daction="save" ${!d.dirty?'disabled':''}>保存配置 · 仅模拟</button>${d.scope==='ticketB'?'<button class="btn" data-daction="clear-override">移除 B 覆盖</button>':''}<button class="btn" data-daction="chat">回到对话与执行状态</button><p>${d.dirty?'有未保存更改':'未保存更改：无'}<br>当前运行不会自动套用新默认。</p></div>${d.configMessage?`<div class="d-config-message" role="status">${esc(d.configMessage)}</div>`:''}<div class="d-config-state"><strong>B 的实际运行</strong><br>${esc(fmt(d.workers.B.config))} / ${d.workers.B.run}<br><span class="muted">后续 B 期望：${esc(fmt(desired()))}<br>后续其他 Worker：${esc(fmt(d.defaults.worker))}</span></div><div class="d-disclosure">生效顺序提案：单次任务覆盖 → effort → 工作区。此原型只编辑 effort 与 B 覆盖。能力和账号限制为 fixture，不代表本机真实授权。</div></section>`}
window.VariantD=function(){sync();return `${sidebarD()}<main class="d-work"><header class="d-top"><div class="grow"><div class="upper dim" style="margin-bottom:7px">Human interface / dedicated dialogue</div><h1>${d.page==='roles'?'角色与模型':'始终有一个 Agent 接住你的意图'}</h1><p class="d-description">对话、调度、执行分开；后台事件保持独立消息边界。</p></div><div class="d-mobile-nav"><button class="btn" data-daction="chat">对话</button><button class="btn" data-daction="roles">角色</button></div><span class="pill green">模拟 · 不连接运行器</span><button class="btn" data-daction="inspect">工作 / 事件 ${d.events.filter(e=>!e.seen).length}</button></header>${d.page==='roles'?configD():chatD()}${guide()}</main>`};
const oldFooterD=footer;footer=function(){if(state.variant!=='D')return oldFooterD();return `<footer class="statusbar"><span class="green">◉ front-01</span><span>B · ${d.workers.B.run}</span><span class="grow"></span><span class="extra">内存状态 · 角色可替换</span><span>● 未连接运行器</span></footer>`};
const previousSwitcher=PrototypeSwitcher;PrototypeSwitcher=function(){const html=previousSwitcher();if(state.variant!=='D')return html;return html.replace(/<div class="state-readout">[\s\S]*?<\/div>/,`<div class="state-readout p-readout">D · draft=${d.draft.length} · events=${d.events.length} · B=${d.workers.B.status} · ${d.workers.B.run} · request=${d.receipt?.status||'none'}</div>`)};
document.addEventListener('input',e=>{if(e.target.id!=='d-composer')return;d.draft=e.target.value;sync();const send=document.querySelector('[data-daction="send"]');if(send)send.disabled=!d.draft.trim();const hint=document.querySelector('.d-composer-hint');if(hint)hint.textContent=d.draft.length+' 字 · 草稿与事件独立';});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='d-scope'){openConfig(el.value);return}if(!el.dataset.dfield)return;const k=el.dataset.dfield,r=el.dataset.drole,c=d.scope==='effort'?d.edits[r]:d.overrideEdit;c[k]=el.value;if(k==='runner')c.model=c.runner==='Codex'?'gpt-6.1-sol':'claude-sonnet-5-5';d.dirty=true;d.configMessage='';redraw();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-daction]');if(!el)return;const a=el.dataset.daction;if(a==='next'){const s=scenarios[d.scenario];if(d.step>=s.steps.length){const sc=d.scenario;d=initial();d.scenario=sc;redraw();return}const op=s.steps[d.step][1];d.step++;act(op);return}act(a)});
const previousChat=chatD;chatD=function(){return `<div style="padding:10px 20px 0"><div class="d-scenario-tabs" aria-label="交互演练">${Object.entries(scenarios).map(([k,v])=>`<button data-dscenario="${k}" class="${d.scenario===k?'active':''}">${v.title}</button>`).join('')}<span class="tiny dim" style="align-self:center">${scenarios[d.scenario].desc}</span></div></div>`+previousChat()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-dscenario]');if(!el)return;d=initial();d.scenario=el.dataset.dscenario;redraw()});
window.dialogueDemo={snapshot,action:act,reset:()=>{d=initial();redraw()}};
if(!new URLSearchParams(location.search).has('variant'))state.variant='D';sync();render();
})();
