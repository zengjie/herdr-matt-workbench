case 'ADOPT':if(p.online&&p.reconciled)adopt(p);break;
case 'RESUME':if(p.correction?.phase==='adopted'&&p.online&&p.reconciled){request(p,'resume',p.correction.target,{constraint:p.constraint});p.correction.phase='resuming';}break;
case 'HANDOFF':if(p.correction?.phase==='adopted'&&p.online&&p.reconciled){const x=find(p,p.correction.target);x.history.push({run:x.run,config:copy(x.config),status:'paused',revision:x.revision});x.runNo++;x.run=x.id+'-0'+x.runNo;x.config=copy(x.override||p.defaults.worker);x.status='working';p.correction.phase='executing';request(p,'handoff',x.id,{from:x.history.at(-1).run}).status='confirmed';event(p,x.id+' 已交接新会话','CoS','原运行保留，约束版本 '+p.constraint);}break;
case 'START':if(t&&['ready','waiting'].includes(t.status)&&t.deps.every(id=>find(p,id)?.status==='merged')&&p.tasks.filter(x=>['working','starting','resuming'].includes(x.status)).length<p.limit&&p.online&&p.reconciled&&!unresolved(p)){request(p,'start',t.id);t.status='starting';}break;
case 'FINISH':if(t&&p.online&&p.reconciled&&!(unresolved(p)&&p.correction.affected.includes(t.id)&&p.correction.phase!=='executing'))returnResult(p,t);break;
case 'ACCEPT':if(t?.status==='review'&&valid(t)&&p.online&&p.reconciled&&!(unresolved(p)&&p.correction.affected.includes(t.id)&&!(p.correction.target===t.id&&p.correction.phase==='executing'))){t.accepted=t.revision;t.status='approved';t.feedback.forEach(f=>f.resolved=true);if(p.correction?.target===t.id&&p.correction.phase==='executing')p.correction.phase='resolved';event(p,t.id+' 已通过人工验收','用户',t.revision);}break;
case 'DEFER':if(t?.status==='review')t.deferred=!t.deferred;break;
case 'REWORK':if(t&&['review','approved'].includes(t.status)&&p.feedbackDraft.trim()&&p.online&&p.reconciled){t.feedback.push({text:p.feedbackDraft,revision:t.revision,location:p.attachments.join('; ')||'结果预览',resolved:false});t.accepted=null;t.stale=true;t.status='working';p.feedbackDraft='';p.integration=null;event(p,t.id+' 已要求返修','用户','继续 '+t.run+'，原反馈绑定 '+t.revision);}break;
case 'EDIT':if(t?.revision&&t.status!=='merged'){t.revision+='-dirty';t.stale=true;t.accepted=null;t.status='review';p.integration=null;event(p,'检测到 '+t.id+' 的代码变化','文件监测','旧验收和报告已失效。');}break;
case 'RECHECK':if(t?.stale&&p.online&&p.reconciled&&!(unresolved(p)&&p.correction.affected.includes(t.id)&&p.correction.phase!=='executing')){t.checks={revision:t.revision,passed:true,command:'pnpm verify --filter '+t.id,output:'3 scenarios passed; 0 failed',standards:'pass',spec:'pass'};t.stale=false;}break;
case 'PREPARE':if(t?.status==='approved'&&valid(t)&&t.accepted===t.revision&&p.online&&p.reconciled&&!(unresolved(p)&&p.correction.affected.includes(t.id))){p.integration={target:t.id,revision:t.revision,base:p.head,candidate:'candidate-'+t.id+'-'+(p.headNo+1),status:'checking'};event(p,t.id+' 正在当前基线验证','集成者',p.head+' + '+t.revision);}break;
case 'INTEGRATE':{const i=p.integration,x=i&&find(p,i.target);if(i?.status==='checking'&&x.status==='approved'&&i.base===p.head&&i.revision===x.revision&&valid(x)&&x.accepted===x.revision&&p.online&&p.reconciled){i.status='passed';x.status='merged';p.head='main-'+(++p.headNo);event(p,x.id+' 已集成','集成者','集成验证通过；共同基线 '+p.head);p.tasks.filter(z=>z.status==='waiting'&&z.deps.every(id=>find(p,id)?.status==='merged')).forEach(z=>z.status='ready');p.integration=null;}break;}
case 'INTEGRATION_FAIL':if(p.integration?.status==='checking')p.integration.status='failed';break;
case 'RETRY_INTEGRATION':if(p.integration?.status==='failed'){p.integration.status='checking';p.integration.base=p.head;}break;
case 'DROP_ACK':{const r=p.requests.find(x=>x.status==='requested');if(r){const shadow=copy(p);ack(shadow,shadow.requests.find(x=>x.id===r.id));p.remote[r.id]={status:'confirmed',run:find(shadow,r.target).run};p.ackLost=true;p.online=false;p.reconciled=false;s.last='模拟：运行器已执行，回执丢失。界面状态未知。';}break;}
case 'DISCONNECT':p.online=false;p.reconciled=false;break;
case 'RELOAD':s.ui.modal=null;p.online=false;p.reconciled=false;s.last='模拟从记录恢复视图：草稿、请求、运行和待办保留；需核对外部状态。';break;
case 'RECONCILE':p.online=true;for(const r of p.requests.filter(x=>x.status==='requested')){if(p.remote[r.id]?.status==='confirmed'){ack(p,r)}else{s.last=r.id+' 尚未确认；保留同一请求，不另起任务。'}}p.reconciled=true;p.ackLost=false;event(p,'运行状态已核对','操作桥','依据原请求编号核对，没有重复启动。');break;
case 'RETRY':if(p.online&&p.reconciled){const r=p.requests.find(x=>x.status==='requested');if(r){r.attempts=(r.attempts||1)+1;s.last='沿用 '+r.id+' 重试；没有新请求或新认领。'}}break;
case 'BLOCK':if(t?.status==='working'){t.status='blocked';t.blockedReason=a.reason||'运行额度不足；原会话与工作目录已保留。';event(p,t.id+' 遇到阻塞','运行器',t.blockedReason);}break;
case 'UNBLOCK':if(t?.status==='blocked'&&p.online&&p.reconciled){t.status='working';t.blockedReason=null;}break;
case 'CONFIG_SCOPE':p.configScope=a.value;if(a.value!=='effort'&&!p.overrideDrafts[a.value])p.overrideDrafts[a.value]=copy(find(p,a.value).override||p.defaults.worker);break;
case 'CONFIG':{const c=p.configScope==='effort'?p.configDraft[a.role]:p.overrideDrafts[p.configScope];c[a.key]=a.value;if(a.key==='runner')c.model=a.value==='Codex'?'gpt-6.1-sol':'claude-sonnet-5-5';break;}
case 'CONFIG_SAVE':if(p.configScope==='effort')p.defaults=copy(p.configDraft);else find(p,p.configScope).override=copy(p.overrideDrafts[p.configScope]);s.last='配置已保存；仅后续启动或明确交接时使用。';break;
case 'LIMIT':p.limit=Number(a.value);break;
case 'CLEAR_OVERRIDE':if(p.configScope!=='effort'){find(p,p.configScope).override=null;p.overrideDrafts[p.configScope]=copy(p.defaults.worker);}break;
case 'LAB':s.ui.lab=!s.ui.lab;break;
}for(const x of Object.values(s.spaces)){if(x.workflow==='draining'&&s.projects[x.project]?.tasks.every(t=>t.status==='merged')){x.workflow='disabled';s.last='现有任务已全部集成，Matt 已停用。';}}return s;}
return {initial,reduce,current,valid,needs,copy};
})();
</script>
<script id="unified-prototype-view">
(()=>{
const M=UnifiedModel;let u=M.initial();
variants.E='简洁工作区';
const switcherBeforeE=PrototypeSwitcher;PrototypeSwitcher=function(){let html=switcherBeforeE();if(state.variant!=='E')return html;return html.replace(/<pre class="state-drawer">[\s\S]*?<\/pre>/,()=>'<pre class="state-drawer">'+esc(JSON.stringify(u,null,2))+'</pre>')};
const demoMode=new URLSearchParams(location.search).get('lab')==='1';
const oldRender=render;render=function(){document.body.classList.toggle('e-simple',state.variant==='E'&&!demoMode);if(state.variant!=='E'){oldRender();return}$('#app').innerHTML=`<div class="proto-banner"><b>交互原型</b><span>验证：只在对话中表达意图、回答问题和验收</span><span>内存模拟 · 未连接真实 Agent</span></div><div class="shell"><div class="titlebar"><div class="logo">h</div><span class="brand">herdr</span><span class="dim">/ 工作区</span><span class="grow"></span><span class="tiny dim">原型 · 所有回执与证据均为模拟</span></div><div class="body">${view()}</div><footer class="statusbar"><span>${M.current(u).online?'● 模拟连接':'○ 状态待核对'}</span><span class="grow"></span><span>一个工作区 · 一个任务来源</span></footer></div>${demoMode?PrototypeSwitcher():''}`;};
const p=()=>M.current(u),sel=()=>p().tasks.find(t=>t.id===p().selected),btn=(label,type,extra='',primary=false,disabled=false)=>`<button class="btn ${primary?'primary':''}" data-e="${type}" ${extra} ${disabled?'disabled':''}>${label}</button>`;
const labels={working:'执行中',waiting:'等待依赖',ready:'可以开始',starting:'等待启动确认',paused:'已暂停',review:'待验收',approved:'已验收 · 待集成',merged:'已集成',blocked:'需要处理'};
const config=c=>c?`${c.runner} / ${c.model.replace('gpt-','').replace('claude-','')} / ${c.effort}`:'启动时使用默认配置';
function repaint(){const a=document.activeElement,id=a?.id,range=typeof a?.selectionStart==='number'?[a.selectionStart,a.selectionEnd]:null,scroll=document.querySelector('.e-scroll')?.scrollTop,modalScroll=document.querySelector('.e-modal')?.scrollTop,opened=[...document.querySelectorAll('.e-main details[open]:not(.e-lab)')].map(e=>e.querySelector('summary')?.textContent);render();document.querySelectorAll('.e-main details').forEach(e=>{if(opened.includes(e.querySelector('summary')?.textContent))e.open=true});const el=id&&document.getElementById(id);if(el){el.focus({preventScroll:true});if(range&&el.setSelectionRange)el.setSelectionRange(...range)}if(document.querySelector('.e-scroll')&&scroll!==undefined)document.querySelector('.e-scroll').scrollTop=scroll;if(document.querySelector('.e-modal')&&modalScroll!==undefined)document.querySelector('.e-modal').scrollTop=modalScroll;}
function dispatch(a){const old=p().id+':'+p().view,oldModal=u.ui.modal;p().readScroll[p().view]=document.querySelector('.e-scroll')?.scrollTop||0;u=M.reduce(u,a);repaint();if(old!==p().id+':'+p().view&&document.querySelector('.e-scroll'))document.querySelector('.e-scroll').scrollTop=p().readScroll[p().view]||0;if(u.ui.modal&&oldModal!==u.ui.modal)document.querySelector('.e-modal button, .e-modal select')?.focus({preventScroll:true});}
function notice(){const w=u.spaces[u.space];if(!w.valid||w.workflow!=='enabled')return workflowNotice();if(!p().online||!p().reconciled)return `<div class="e-notice">状态待核对。保留现场，暂停新的执行操作。<div class="e-actions">${btn('核对并恢复','RECONCILE','',true)}</div><span class="e-caption">按原请求查询运行器，不重复启动。</span></div>`;return '';}
function summary(){const running=p().tasks.filter(t=>t.status==='working').length,done=p().tasks.every(t=>t.status==='merged');return `<div class="e-summary"><div class="grow"><strong>${done?'这项工作已完成':p().integration?.status==='checking'?'验收已通过，正在验证集成结果':running?running+' 项任务正在推进':'工作进展已保留'}</strong><p>${done?'已完成本地验收与集成验证。':'需要你判断的事项会直接出现在这里。'}</p></div></div>`;}
function attentionCards(){return M.needs(p()).filter(n=>!['resume','recover'].includes(n.type)).map(n=>{const t=p().tasks.find(t=>t.id===n.id);if(n.type==='decision'){const q=p().decisions.find(q=>q.id===n.id);return `<section class="e-box e-attention" data-card="decision"><small class="e-caption">需要你决定</small><h2 style="margin-top:8px">${esc(q.title)}</h2><div class="e-actions">${q.options.map(v=>btn(esc(v),'DECIDE',`data-id="${q.id}" data-value="${esc(v)}"`)).join('')}</div></section>`;}if(n.type==='review'){return `<section class="e-box e-attention" data-card="review" data-task="${t.id}"><small class="e-caption">请验收 · ${t.id} · ${esc(t.revision)}</small><h2 style="margin-top:8px">${esc(t.title)}</h2><p>${t.stale?'代码或约束已变化，旧验收不能沿用。':'验证与两项审阅已返回，是否符合你的预期？'}</p><div class="e-actions">${btn('预览与证据','RESULT',`data-id="${t.id}"`)}${btn('通过','ACCEPT',`data-id="${t.id}"`,true,!M.valid(t)||unavailable())}${btn('要求修改','FEEDBACK',`data-id="${t.id}"`)}${btn('稍后','DEFER',`data-id="${t.id}"`)}</div>${p().feedbackOpen===t.id?`<div style="margin-top:14px"><label for="e-feedback">${t.id} · 针对 ${esc(t.revision)} 的修改意见</label><textarea class="e-form" id="e-feedback" aria-label="返修反馈" placeholder="描述预期和实际表现…">${esc(p().feedbackDraft)}</textarea><div class="e-actions">${btn('发送修改意见','REWORK',`data-id="${t.id}"`,true,!p().feedbackDraft.trim()||unavailable())}</div></div>`:''}</section>`;}return `<section class="e-box e-attention"><h2>${esc(n.title)}</h2><p>${esc(n.detail)}</p>${btn('查看并处理','NEED',`data-index="${M.needs(p()).findIndex(x=>x.type===n.type&&x.id===n.id)}"`)}</section>`;}).join('');}

function taskCard(t){return `<button class="e-task ${t.id===p().selected?'selected':''} ${t.deps.length?'e-downstream':''}" data-e="SELECT" data-id="${t.id}"><div class="row spread"><span class="tiny dim">任务 ${t.id}</span><span class="e-status ${['review','blocked','paused'].includes(t.status)?'warn':''}">${labels[t.status]}</span></div><h3>${esc(t.title)}</h3><p>${t.deps.length?'依赖 '+t.deps.join('、')+' 的集成结果':t.run?'独立工作目录 · '+t.environment:'一个开发 Agent · 沿用默认配置'}${t.stale?' · 旧证据已失效':''}</p></button>`;}
function correction(){const c=p().correction;if(!c)return '';const x=p().tasks.find(t=>t.id===c.target),phase={requested:'已请求暂停，等待确认',paused:'已暂停，等待采用新约束',adopted:'新约束已采用，可以继续',resuming:'已请求继续，等待确认',executing:'正在按新约束修改',resolved:'已复验通过'}[c.phase];return `<div class="e-box"><span class="tiny dim">纠偏 · ${c.target}</span><h2 style="margin-top:8px">${phase}</h2><p>${esc(c.text)}</p><p>影响 ${c.affected.join('、')}；${p().tasks.filter(t=>!c.affected.includes(t.id)).map(t=>t.id).join('、')||'无其他任务'} 保留原进度。${c.phase==='adopted'?'将继续原会话 '+x.run+'。':''}</p>${c.phase==='adopted'?`<div class="e-actions">${btn('继续原 Agent','RESUME','',true,!p().online)}${btn('改用其他 Agent…','OPEN','data-value="handoff"')}</div>`:''}<details class="e-detail"><summary>查看操作进度</summary><div class="e-history">请求 → 暂停回执 → 采用约束 → 继续回执 → 新结果 → 复验<br>当前：${phase}<br>${p().requests.filter(r=>r.target===c.target).map(r=>esc(r.id+' · '+r.kind+' · '+r.status)).join('<br>')}<br>暂停仅针对 Agent 轮次；预览服务保留，外部动作状态需另行核对。</div></details></div>`;}
function chat(){return `<div class="e-chat">${summary()}${attentionCards()}${p().messages.map(m=>`<div class="e-msg ${m.role}"><small>${m.role==='user'?'你'+(m.target&&m.target!=='project'?' · 讨论 '+m.target:''):'对话 Agent'}</small>${esc(m.text)}${m.attachments?.length?`<div class="e-attachments">${m.attachments.map(esc).join(' · ')}</div>`:''}</div>`).join('')}${p().busy?'<div class="e-caption">对话 Agent 正在回复 · 新输入可排队</div>':''}${p().queued.length?`<div class="e-queued">${p().queued.length} 条用户消息等待接续；与后台事件分开。</div>`:''}${p().summary?`<details class="e-detail"><summary>查看 Agent 读取的事件摘要</summary><div class="e-history">${esc(p().summary)}<br>已读取不等于用户已处理。</div></details>`:''}${correction()}${p().correctionOpen?correctionForm():''}${p().mode==='轻量任务'&&sel().status==='ready'?`<div class="e-box"><h2>直接开始这个小修复</h2><p>使用一位开发 Agent。无需先拆任务或设置调度角色。</p>${btn('开始开发','START','data-id="S"',true,unavailable()||u.spaces[u.space].workflow==='draining')}</div>`:''}<p class="e-caption" style="margin-top:16px">自由输入展示消息与上下文边界；执行使用明确操作。回复为预设模拟。</p></div>`;}
function correctionForm(){return `<div class="e-box"><h2>纠正 ${p().selected} · ${esc(sel().title)}</h2><textarea class="e-form" id="e-correction" aria-label="纠偏约束">${esc(p().correctionDraft)}</textarea><p>只暂停受影响的工作；已有改动保留。新约束需要 Agent 确认采用。</p><div class="e-actions">${btn('发送纠偏','CORRECTION_SEND','data-id="'+p().selected+'"',true,unavailable()||!!(p().correction&&p().correction.phase!=='resolved'))}${btn('取消','CANCEL_CORRECTION')}</div></div>`;}
const unavailable=()=>!p().online||!p().reconciled||!u.spaces[u.space].valid||!['enabled','draining'].includes(u.spaces[u.space].workflow);
function work(){const ts=p().tasks;return `${summary()}<div class="row spread" style="margin-bottom:15px"><h2>${p().mode==='轻量任务'?'一个请求，一位开发 Agent':'并行任务'}</h2><span class="e-caption">${ts.filter(t=>['working','starting'].includes(t.status)).length}/${p().limit} 活跃</span></div><div class="e-cards">${ts.filter(t=>!t.deps.length).map(taskCard).join('')}${ts.some(t=>t.deps.length)?'<div class="e-deps">↓ 前置任务集成后，才放行下游 ↓</div>':''}${ts.filter(t=>t.deps.length).map(taskCard).join('')}</div>${taskDetail(sel())}`;}
function taskDetail(t){const pending=p().requests.find(r=>r.target===t.id&&r.status==='requested');return `<div class="e-box e-task-detail"><div class="row spread"><h2>${t.id} · ${esc(t.title)}</h2><span class="e-status">${labels[t.status]}</span></div><p>${t.run?'当前运行 '+t.run:'尚未启动'}${pending?' · 操作等待确认':''}</p><div class="e-actions">${t.status==='ready'?btn('开始开发','START',`data-id="${t.id}"`,true,unavailable()||u.spaces[u.space].workflow==='draining'):''}${['working','review','approved'].includes(t.status)?btn('纠正方向','CORRECTION_OPEN',`data-id="${t.id}"`):''}${t.revision?btn('查看结果','RESULT',`data-id="${t.id}"`,t.status==='review'):''}${btn('在对话中讨论','TARGET',`data-id="${t.id}"`)}</div>${t.status==='blocked'?`<div class="e-notice" style="margin-top:14px">${esc(t.blockedReason)}<div class="e-actions">${btn('恢复原会话','UNBLOCK',`data-id="${t.id}"`,true,unavailable())}</div></div>`:''}<details class="e-detail"><summary>运行、上下文与来源</summary><div class="e-history">仓库 ${p().repo}<br>工作目录 .worktrees/${p().id}/${t.id}<br>基线 ${t.base} → 当前结果 ${t.revision||'未返回'}<br>环境 ${t.environment}（任务独占）<br>实际配置 ${esc(config(t.config))}<br>后续配置 ${esc(config(t.override||p().defaults.worker))}<br>约束版本 ${t.constraint}<br>${p().savedSources.map(esc).join('<br>')}${t.history.length?'<br>保留的运行：'+t.history.map(x=>x.run+'（'+x.status+'）').join('、'):''}</div><div class="e-actions">${btn('查看模拟终端','TERMINAL',`data-id="${t.id}"`)}${btn('设置此任务的 Agent','TASK_CONFIG',`data-id="${t.id}"`)}</div></details></div>`;}
function result(){const t=sel();return `<div class="row spread" style="margin-bottom:16px"><h2>结果与验收</h2><select class="e-mobile-project" style="display:block" data-echange="result" aria-label="选择结果任务">${p().tasks.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.id} · ${esc(x.title)}</option>`).join('')}</select></div>${!t.revision?`<div class="e-empty">${t.id} 还没有返回结果。<br>可以继续讨论或查看任务进展。<div class="e-actions" style="justify-content:center">${btn('查看任务','VIEW','data-value="work"')}</div></div>`:resultBody(t)}`;}
function resultBody(t){const valid=M.valid(t);return `<div class="e-box"><div class="row spread"><h2>${t.id} · ${esc(t.title)}</h2><span class="e-status ${t.stale?'warn':''}">${t.stale?'需要重新验证':labels[t.status]}</span></div><p>本次验收对象：<span class="mono">${t.base} → ${t.revision}</span> · ${t.run}</p>${t.stale?'<div class="e-notice">代码或约束已变化，旧报告与验收结论失效。</div>':''}${t.status==='review'?`<div class="e-actions">${btn('通过验收','ACCEPT',`data-id="${t.id}"`,true,!valid||unavailable())}${btn('要求修改…','FEEDBACK')}${btn(t.deferred?'恢复待办提醒':'稍后验收','DEFER',`data-id="${t.id}"`)}${t.stale?btn('重新验证','RECHECK',`data-id="${t.id}"`,false,unavailable()):''}</div>`:''}${t.status==='approved'?'<p>验收已通过，正在当前共同基线上验证集成结果。</p>':''}<div class="e-preview"><header>运行画面示例 · ${t.revision} · ${t.environment} · fixture 数据</header><section><label>${t.id==='S'?'空状态文案':'当前上下文'}</label><strong>${t.id==='S'?'还没有任务':'未知'}</strong><p style="color:#718073">${t.id==='S'?'创建第一个任务，开始推进工作。':'未获取到可靠数据时，明确显示“未知”。'}</p></section></div><div class="e-evidence"><div><small>自动验证</small>${valid?'✓ 场景通过':'○ 等待重新验证'}<small>${esc(t.checks?.command||'未执行')} @ ${esc(t.checks?.revision||'—')}</small></div><div><small>两项独立审阅</small>${valid?'✓ Standards · ✓ Spec':'○ 报告需更新'}<small>同一固定版本 · 模拟报告</small></div></div><details class="e-detail"><summary>代码、验证输出与反馈记录</summary><pre>repo: ${p().repo}\nworktree: .worktrees/${p().id}/${t.id}\nbase: ${t.base}\nhead / dirty snapshot: ${t.revision}\n\n示例 diff（非真实代码）：\n- render(estimate(value))\n+ render(value ?? '未知')\n\n${esc(t.checks?.command||'')}\n${esc(t.checks?.output||'')}\nstandards: ${t.checks?.standards||'pending'} @ ${t.checks?.revision||'—'}\nspec: ${t.checks?.spec||'pending'} @ ${t.checks?.revision||'—'}</pre>${t.feedback.length?t.feedback.map(f=>`<div class="e-history">${esc(f.revision)} · ${esc(f.location)}<br>${esc(f.text)}<br>${f.resolved?'复验通过，已关闭':'等待返修与复验'}</div>`).join(''):'<p>暂无返修反馈。</p>'}</details>${t.status==='review'?`<details class="e-detail" id="e-feedback-detail"><summary>返修反馈</summary><textarea class="e-form" id="e-feedback" aria-label="返修反馈" placeholder="位置、预期表现、实际表现，以及是否阻塞验收">${esc(p().feedbackDraft)}</textarea><div class="e-actions">${btn('要求修改','REWORK',`data-id="${t.id}"`,false,!p().feedbackDraft.trim()||unavailable())}</div><p>反馈绑定 ${t.revision}；由原 Agent 返修，返回新版本后再次验收。</p></details>`:''}${p().integration?.target===t.id?`<div class="e-notice">${p().integration.status==='failed'?'集成验证失败；共同基线未改变。':'候选结果正在集成验证；共同基线尚未改变。'}${p().integration.status==='failed'?`<div class="e-actions">${btn('修复后重新验证','RETRY_INTEGRATION','',true)}</div>`:''}</div>`:''}${t.status==='merged'?'<p class="green">✓ 已验收并完成集成验证。</p>':''}</div><p class="e-caption">当前完成条件：${p().finishCondition}。真实 PR、CI 和部署尚未接入。</p>`;}
function composer(){return `<div class="e-compose"><div class="e-compose-inner"><div class="e-target"><span class="e-dot"></span><span>与你的对话 Agent 交流</span><span class="grow"></span><button data-e="OPEN" data-value="target">讨论对象：${p().target==='project'?'整个工作':p().target} ▾</button></div>${p().attachments.length?`<div class="e-attachments">${p().attachments.map(esc).join(' · ')} <button data-e="REMOVE_ATTACH" aria-label="移除上下文">×</button></div>`:''}<div class="e-input-row"><button class="btn" data-e="OPEN" data-value="attach" aria-label="附加上下文">＋</button><textarea class="e-form" id="e-composer" aria-label="给对话 Agent 的消息" placeholder="说说你的想法，或指出需要调整的地方…">${esc(p().draft)}</textarea>${btn(p().busy?'排队 ↑':'发送 ↑','SEND','',true,!p().draft.trim())}</div></div></div>`;}
const scenarios={workspace:{name:'工作区启用与恢复',desc:'普通 Space 不启用 Matt；停用先收尾、确认暂停，恢复先核对。',steps:[['切换普通 Space','SPACE','plain'],['模拟后台问题','ASK'],['返回 Matt Space','SPACE','main'],['停用 Matt','DISABLE_MATT'],['请求暂停并保留现场','PAUSE_WORKSPACE'],['模拟确认暂停','ACK_WORKSPACE_PAUSE'],['重新启用','ENABLE_MATT'],['核对原现场','CHECK_WORKSPACE'],['继续原工作','CONTINUE_WORKSPACE']]},correction:{name:'并行与纠偏',desc:'B 改用“未知”，A 继续。新约束确认后，继续 B 原会话。',steps:[['打开 B 的纠偏','CORRECTION_OPEN','B'],['发送纠偏','CORRECTION_SEND','B'],['模拟暂停回执','ACK'],['模拟采用新约束','ADOPT'],['继续原 Agent','RESUME'],['模拟继续回执','ACK'],['模拟 B 返回结果','FINISH','B'],['查看新结果','RESULT','B'],['通过纠偏后的验收','ACCEPT','B']]},acceptance:{name:'验收与返修',desc:'结果绑定版本；返修返回新版本后重新验收，再进行集成验证。',steps:[['模拟 A 返回结果','FINISH','A'],['查看结果','RESULT','A'],['填写返修意见','FILL_FEEDBACK'],['要求修改','REWORK','A'],['模拟返修完成','FINISH','A'],['通过新版本验收','ACCEPT','A'],['准备集成候选','PREPARE','A'],['模拟集成验证通过','INTEGRATE']]},recovery:{name:'回执丢失与恢复',desc:'运行器已经暂停，但回执丢失；恢复时沿用原请求，不启动第二次。',steps:[['打开 B 的纠偏','CORRECTION_OPEN','B'],['发送纠偏','CORRECTION_SEND','B'],['模拟回执丢失','DROP_ACK'],['模拟 UI 重新载入','RELOAD'],['查询原请求并恢复','RECONCILE'],['模拟采用新约束','ADOPT'],['继续原 Agent','RESUME'],['模拟继续回执','ACK']]},dependency:{name:'依赖与集成',desc:'A、B 各自验收后还要在当前共同基线上验证；两项都集成才放行 C。',steps:[['A 返回结果','FINISH','A'],['验收 A','ACCEPT','A'],['准备 A 集成','PREPARE','A'],['通过 A 集成验证','INTEGRATE'],['B 返回结果','FINISH','B'],['验收 B','ACCEPT','B'],['准备 B 集成','PREPARE','B'],['通过 B 集成验证','INTEGRATE'],['启动 C','START','C'],['模拟 C 启动回执','ACK']]},simple:{name:'小修复',desc:'不配置角色，不拆任务；一个请求直接交给一位开发 Agent。',steps:[['开始小修复','START','S'],['模拟启动回执','ACK'],['模拟返回结果','FINISH','S'],['查看结果','RESULT','S'],['通过验收','ACCEPT','S'],['准备集成','PREPARE','S'],['通过集成验证','INTEGRATE']]}};
function lab(){if(!demoMode)return '';const g=scenarios[u.ui.scenario],step=g.steps[u.ui.step];return `<details class="e-lab" ${u.ui.lab?'open':''}><summary>演练控件 · 仅用于模拟回执与故障</summary><div class="e-lab-inner"><select aria-label="选择演练场景" id="e-scenario">${Object.entries(scenarios).map(([k,x])=>`<option value="${k}" ${u.ui.scenario===k?'selected':''}>${x.name}</option>`).join('')}</select><span>${u.ui.step}/${g.steps.length}</span>${btn(step?step[0]:'从头演练','NEXT','',true)}${btn('重置本场景','RESET_SCENARIO')}<p>${g.desc}</p><details style="width:100%"><summary>自由模拟与完整状态</summary><div class="e-actions">${btn('后台事件到达','NOTIFY')}${btn('Agent 请求决策','ASK')}${btn('完成一轮回复','REPLY')}${btn('所选任务返回结果','FINISH',`data-id="${p().selected}"`)}${btn('收到执行回执','ACK')}${btn('采用纠偏约束','ADOPT')}${btn('候选验证通过','INTEGRATE')}${btn('候选验证失败','INTEGRATION_FAIL')}${btn('代码发生变化','EDIT')}${btn('重载视图','RELOAD')}${btn('额度耗尽','BLOCK')}${btn('沿用原请求重试','RETRY')}</div><pre class="e-code">${esc(JSON.stringify(u,null,2))}</pre></details>${u.last?`<p role="status">${esc(u.last)}</p>`:''}</div></details>`;}
function configModal(){const scope=p().configScope,rs=scope==='effort'?[['dialogue','对话 Agent'],['cos','调度'],['worker','开发'],['review','审阅'],['merge','集成']]:[['worker','开发']];return `<p class="e-caption">沿用默认即可。保存只影响后续启动，现有会话不会自动换模型。目录为研究快照，真实可用性尚未查询。</p><p class="e-caption" style="margin-top:10px">当前对话实际使用 ${esc(config(p().frontConfig))} · ${p().frontRun}</p><div style="margin-top:16px"><select id="e-config-scope" aria-label="配置作用域"><option value="effort">当前工作默认</option>${p().tasks.map(t=>`<option value="${t.id}" ${scope===t.id?'selected':''}>仅任务 ${t.id}</option>`).join('')}</select></div>${rs.map(([key,name])=>{const c=scope==='effort'?p().configDraft[key]:p().overrideDrafts[scope],models=c.runner==='Codex'?['gpt-6.1-sol','gpt-6-astra','gpt-6.1-terra','gpt-6-sol','gpt-6-luna']:['claude-opus-5-5','claude-sonnet-5-5','claude-haiku-5-5'];return `<div class="e-model-row"><strong>${name}</strong><select data-role="${key}" data-key="runner" aria-label="${name} 运行器">${['Codex','Claude Code'].map(v=>`<option ${v===c.runner?'selected':''}>${v}</option>`).join('')}</select><select data-role="${key}" data-key="effort" aria-label="${name} 思考强度">${['low','medium','high','xhigh','max'].map(v=>`<option ${v===c.effort?'selected':''}>${v}</option>`).join('')}</select><select data-role="${key}" data-key="model" aria-label="${name} 模型">${models.map(v=>`<option ${v===c.model?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}<div class="e-actions">${btn('保存后续配置','CONFIG_SAVE','',true)}${scope!=='effort'?btn('恢复默认','CLEAR_OVERRIDE'):''}</div><p class="e-caption" style="margin-top:14px">编辑草稿在关闭、切换作用域和项目后保留。模型能力和权限以真实运行器为准；这里不会发送调用。</p>`;}
function modal(){const key=u.ui.modal;if(!key)return '';let title='',body='';if(key==='work'){title='任务';body=work();}else if(key==='result'){title='结果与证据';body=result();}else if(key==='workspace'){title='工作区设置';body=workspaceSettings();}else if(key==='decision'){title='确认一个问题';const q=p().decisions.find(d=>!d.answer);body=q?`<div class="e-box"><h2>${esc(q.title)}</h2><p>你的选择会保存到共同依据。仅提出问题不会暂停无关工作。</p><div class="e-actions">${q.options.map(v=>btn(esc(v),'DECIDE',`data-id="${q.id}" data-value="${esc(v)}"`)).join('')}</div></div>`:'<p>问题已处理。</p>';}else if(key==='needs'){title='需要你处理';const n=M.needs(p());body=n.length?n.map((x,i)=>`<div class="e-box"><h2>${esc(x.title)}</h2><p>${esc(x.detail)}</p>${btn('去处理','NEED',`data-index="${i}"`,true)}</div>`).join(''):'<div class="e-empty">目前没有需要你处理的事项。<br>普通进展保留在后台。</div>';}else if(key==='events'){title='后台进展';body=`<p class="e-caption">独立收件箱。Agent 已读取、用户已处理分别记录。</p><div class="e-actions">${btn('让 Agent 读取摘要','SUMMARIZE','',false,!p().events.some(e=>!e.readByAgent))}</div>${p().events.map(e=>`<div class="e-box"><span class="e-caption">${e.id} · ${esc(e.source)} · ${e.readByAgent?'Agent 已读取':'未读取'}</span><h3 style="margin:8px 0">${esc(e.title)}</h3><p>${esc(e.detail)}</p></div>`).join('')||'<div class="e-empty">没有新的后台进展。</div>'}`;}else if(key==='config'){title='Agent 设置';body=configModal();}else if(key==='more'){title='工作设置';body=workspaceSettings()+`<div class="e-actions">${btn('角色与模型','OPEN','data-value="config"')}${btn('后台进展 '+p().events.length,'OPEN','data-value="events"')}${btn('目标与依据','OPEN','data-value="sources"')}</div><div class="e-box"><h2>同时进行的开发任务</h2><select id="e-limit" aria-label="并行任务上限">${[1,2,3].map(v=>`<option value="${v}" ${p().limit===v?'selected':''}>${v} 位开发 Agent</option>`).join('')}</select><p>不终止已有任务。新启动受此限制，预览端口按任务隔离。</p></div><p class="e-caption">首版范围：本机、单仓库、两个演示工作。推送、发布和 CI 尚未接入。</p>`;}else if(key==='target'){title='这次讨论什么';body=btn('整个工作','TARGET','data-id="project"',p().target==='project')+p().tasks.map(t=>`<div class="e-box">${btn(t.id+' · '+esc(t.title),'TARGET',`data-id="${t.id}"`,p().target===t.id)}</div>`).join('')+'<p class="e-caption">选择阅读某个任务不会自动改变讨论对象。执行操作另行显示具体目标。</p>';}else if(key==='attach'){title='附加上下文';body=`<p class="e-caption">本原型添加示例引用，不读取真实文件或上传内容。</p><div class="e-actions">${btn('代码范围示例','ATTACH','data-value="src/unknown.ts:18–26 · 保留未知状态"')}${btn('画面批注示例','ATTACH','data-value="截图示例 · 未知数据卡片右上角"')}${btn('日志示例','ATTACH','data-value="verify.log:42–49 · 失败输出示例"')}</div>`;}else if(key==='sources'){title='目标与共同依据';body=`<div class="e-box"><h2>${esc(p().goal)}</h2><p>当前基线 ${p().head} · 约束版本 ${p().constraint}</p><p>完成条件：${p().finishCondition}</p>${p().savedSources.map(x=>'<p>'+esc(x)+'</p>').join('')}<p>来源均为原型指针，不代表文件已存在或验证通过。</p></div>`;}else if(key==='terminal'){title='运行现场 · '+sel().id;body=`<pre class="e-code">运行 ${sel().run||'未启动'}\n工作目录 .worktrees/${p().id}/${sel().id}\n环境 ${sel().environment}\n当前 ${labels[sel().status]}\n最后进展：读取约束版本 ${sel().constraint}\n\n这是终端入口示意，不能输入命令。</pre><p class="e-caption">真实产品在此打开原生终端。局部沟通的共享约束要回写任务，并由唯一调度者确认影响。</p>`;}else if(key==='handoff'){title='为 '+p().correction?.target+' 更换 Agent';const t=p().tasks.find(x=>x.id===p().correction?.target);body=`<div class="e-box"><p>原会话 ${t.run} 保留为暂停现场。</p><p>新会话使用：${esc(config(t.override||p().defaults.worker))}</p><p>会带上目标、约束版本、工作目录、反馈和操作记录。</p><div class="e-actions">${btn('修改此任务配置','TASK_CONFIG',`data-id="${t.id}"`)}${btn('确认交接新会话','HANDOFF','',true,unavailable())}</div></div>`;}return `<div class="e-backdrop"><section class="e-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${title}</h2>${btn('关闭','CLOSE')}</header>${body}</section></div>`;}
function mattView(){return `<div class="e-layout">${spaceNav()}<main class="e-main"><header class="e-head"><div class="grow"><h1>${p().title}</h1><p>${p().goal}</p></div><select class="e-mobile-project" id="e-space" aria-label="切换 Space">${Object.entries(u.spaces).filter(([id])=>demoMode||id!=='alias').map(([id,x])=>`<option value="${id}" ${id===u.space?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${btn('任务','OPEN','data-value="work"')}${btn('•••','OPEN','data-value="more"')}</header><section class="e-scroll"><div class="e-content">${notice()}${chat()}</div></section>${composer()}${lab()}${modal()}</main></div>`;}

const workflowLabel={enabled:'Matt 已启用',draining:'正在收尾',disabled:'Matt 未启用',recovering:'等待恢复核对'};
function workflowNotice(){const w=u.spaces[u.space];return `<div class="e-notice">${!w.valid?'目录绑定失效，执行已暂停':workflowLabel[w.workflow]}<p>${w.workflow==='draining'?'现有任务可以继续收尾；不启动后续 Ticket。':w.workflow==='recovering'?'先核对原会话、目录与产物，再明确继续。':'保留任务、反馈、问题与运行记录。'}</p><div class="e-actions">${btn('查看工作区设置','OPEN','data-value="workspace"')}</div></div>`;}
function workspaceSettings(){const w=u.spaces[u.space];return `<div class="e-box"><h2>${esc(w.title)}</h2><div class="e-actions">${btn(u.layout==='matt'?'返回原工作台':'进入 Matt 工作台',u.layout==='matt'?'EXIT_MATT':'ENTER_MATT','',false,!w.project&&u.layout!=='matt')}</div><p>固定目录 <code>${esc(w.folder)}</code><br>${workflowLabel[w.workflow]}${!w.valid?' · 绑定失效':''}</p><p>终端 cd 不改变绑定。Worker worktree 归属原 Effort，不另起 CoS。</p><div class="e-actions">${w.workflow==='enabled'?btn('停用 Matt…','DISABLE_MATT'):w.workflow==='draining'?btn('暂停并保留现场','PAUSE_WORKSPACE')+btn('取消停用，恢复 Matt','CANCEL_DISABLE'):w.workflow==='recovering'?btn(w.checked?'已核对原现场':'核对原现场 · 模拟','CHECK_WORKSPACE','',false,w.checked||!w.valid)+btn('继续原工作','CONTINUE_WORKSPACE','',true,!w.checked||!w.valid):btn(w.project?'重新启用 Matt':'在此工作区启用 Matt','ENABLE_MATT','',true)}${!w.valid?btn('明确重新关联原工作','CONFIRM_BINDING'):''}</div>${w.pauseRequested?`<div class="e-notice">等待暂停回执；不会直接杀进程或删除工作目录。<div class="e-actions">${btn('模拟运行器确认暂停','ACK_WORKSPACE_PAUSE')}</div></div>`:''}</div>${demoMode?`<details class="e-detail"><summary>演练目录与入口边界</summary><div class="e-actions">${btn('Space 改名 · 模拟','RENAME_SPACE')}${btn('目录失效 / 重建入口 · 模拟','INVALID_BINDING')}</div><p>普通 Space 不启动本项目的 Agent。相同固定目录重复启用会定位已有入口。示例只在内存核对，不访问真实目录。</p></details>`:''}`;}
function spaceNav(){return `<aside class="e-nav"><div class="e-brand">Spaces</div>${Object.entries(u.spaces).filter(([id])=>demoMode||id!=='alias').map(([id,x])=>`<button class="${u.space===id?'active':''}" data-e="SPACE" data-id="${id}">${esc(x.title)}<small>${x.workflow==='enabled'?'':workflowLabel[x.workflow]}${x.project&&M.needs(u.projects[x.project]).length?(x.workflow==='enabled'?'':' · ')+M.needs(u.projects[x.project]).length+' 项待处理':''}</small></button>`).join('')}<div class="e-nav-bottom"><button data-e="OPEN" data-value="workspace">工作区设置</button>${u.layout==='matt'?'<button data-e="EXIT_MATT">返回原工作台</button>':''}<small style="padding:10px">内存原型 · 刷新清空<br>切换 Space 不切换窗口布局</small></div></aside>`;}
function view(){const w=u.spaces[u.space],enhanced=u.layout==='matt'&&w.project&&w.workflow!=='disabled';if(enhanced){return mattView().replace(/<aside class="e-nav">[\s\S]*?<\/aside>/,()=>spaceNav()).replace(/<select class="e-mobile-project" id="e-project"[\s\S]*?<\/select>/,()=>`<select class="e-mobile-project" id="e-space" aria-label="切换 Space">${Object.entries(u.spaces).filter(([id])=>demoMode||id!=='alias').map(([id,x])=>`<option value="${id}" ${id===u.space?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`);}const pending=Object.entries(u.spaces).filter(([id,x])=>x.project&&M.needs(u.projects[x.project]).length),count=pending.reduce((n,[id,x])=>n+M.needs(u.projects[x.project]).length,0);return `<div class="e-layout">${spaceNav()}<main class="e-main"><header class="e-head"><div class="grow"><h1>${esc(w.title)}</h1><p>${u.layout==='original'?'原工作台':'普通终端 · Matt 窗口布局保留'} · ${workflowLabel[w.workflow]}</p></div><select id="e-space" aria-label="切换 Space">${Object.entries(u.spaces).filter(([id])=>demoMode||id!=='alias').map(([id,x])=>`<option value="${id}" ${id===u.space?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${btn('工作区设置','OPEN','data-value="workspace"')}</header><section class="e-scroll"><div class="e-content"><div class="terminal" style="min-height:260px"><div class="terminal-head">终端示意 · 不执行命令</div><div class="terminal-body">${esc(w.folder)}<br><span class="green">❯</span> <span class="cursor"></span><p style="margin-top:22px">${!w.project?'继续使用原有工具与开发方式。':'任务与现场保留在原 Matt 工作区。'}</p></div></div><div class="e-actions">${w.project&&u.layout==='original'?btn('进入 Matt 工作台','ENTER_MATT','',true):''}${u.layout==='matt'?btn('返回原工作台','EXIT_MATT'):''}</div>${count?`<details class="e-detail"><summary>Matt 待你处理 · ${count}</summary>${pending.map(([id,x])=>`<div class="e-actions">${btn(esc(x.title)+' · '+M.needs(u.projects[x.project]).length+' 项','GO_PENDING',`data-id="${id}"`)}</div>`).join('')}</details>`:''}${w.project&&w.workflow==='disabled'?'<p class="e-caption">Matt 已停用。重新启用后，先核对再继续。</p>':''}${demoMode?`<details class="e-detail"><summary>演练后台待处理事项</summary><div class="e-actions">${btn('模拟原 Matt 工作提出问题','ASK')}</div><p>只更新汇总标记，不切换 Space 或布局。</p></details>`:''}${lab()}${u.last?`<p class="e-caption" role="status">${esc(u.last)}</p>`:''}</div></section>${modal()}</main></div>`;}
function scenario(key){u=M.initial();u.layout='matt';u.ui.scenario=key;u.ui.lab=true;if(key==='simple'){u.active='small';u.space='small'}else if(key==='acceptance')u.projects.main.view='result';else if(key==='dependency')u.projects.main.view='work';repaint();}
function action(a){if(a.type==='VIEW'){if(a.value==='chat'){dispatch({type:'CLOSE'});return}dispatch({type:'OPEN',value:a.value==='work'?'work':'result'});return}if(a.type==='GO_PENDING'){dispatch({type:'SPACE',id:a.id});dispatch({type:'ENTER_MATT'});if(u.spaces[u.space].workflow!=='disabled')dispatch({type:'OPEN',value:'needs'});else dispatch({type:'OPEN',value:'workspace'});return}if(a.type==='NEXT'){const g=scenarios[u.ui.scenario],step=g.steps[u.ui.step];if(!step){scenario(u.ui.scenario);return}u.ui.step++;action({type:step[1],id:step[2]});return}if(a.type==='RESET_SCENARIO'){scenario(u.ui.scenario);return}if(a.type==='NEED'){const x=M.needs(p())[a.index||0];u.ui.modal=null;if(!x)return;if(x.id)p().selected=x.id;if(x.type==='decision')u.ui.modal='decision';else if(x.type==='review')u.ui.modal='result';else if(x.type==='resume')p().view='chat';else if(x.type==='recover')dispatch({type:'RECONCILE'});else u.ui.modal='work';repaint();return}if(a.type==='RESULT'){if(a.id)p().selected=a.id;dispatch({type:'OPEN',value:'result'});return}if(a.type==='FEEDBACK'){if(!u.ui.modal){if(a.id)p().selected=a.id;p().feedbackOpen=a.id||p().selected;repaint();document.querySelector('#e-feedback')?.focus({preventScroll:true});return}const el=document.querySelector('#e-feedback-detail');if(el){el.open=true;el.scrollIntoView({block:'nearest'});document.querySelector('#e-feedback')?.focus({preventScroll:true});}return}if(a.type==='FILL_FEEDBACK'){dispatch({type:'FIELD',key:'feedbackDraft',value:'预览中的未知提示不够明显，请保留“未知”并补充说明。'});return}if(a.type==='CANCEL_CORRECTION'){p().correctionOpen=false;repaint();return}if(a.type==='TASK_CONFIG'){dispatch({type:'CONFIG_SCOPE',value:a.id});dispatch({type:'OPEN',value:'config'});return}if(a.type==='TERMINAL'){p().selected=a.id;dispatch({type:'OPEN',value:'terminal'});return}dispatch(a);if(a.type==='ACCEPT'){const t=p().tasks.find(t=>t.id===(a.id||p().selected));if(t?.status==='approved'&&!p().integration)dispatch({type:'PREPARE',id:t.id});}if(a.type==='CORRECTION_OPEN')dispatch({type:'CLOSE'});if(a.type==='SELECT'&&u.ui.modal==='work')document.querySelector('.e-task-detail')?.scrollIntoView({block:'nearest'});if(a.type==='ATTACH'||a.type==='HANDOFF'||a.type==='DECIDE')dispatch({type:'CLOSE'});if(a.type==='CONFIG_SAVE')toast('已保存后续配置，当前运行保持不变。');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-e]');if(!el||el.disabled)return;action({type:el.dataset.e,id:el.dataset.id,value:el.dataset.value,index:Number(el.dataset.index||0)});});
document.addEventListener('input',e=>{const key={'e-composer':'draft','e-feedback':'feedbackDraft','e-correction':'correctionDraft'}[e.target.id];if(!key)return;u=M.reduce(u,{type:'FIELD',key,value:e.target.value});const name=key==='draft'?'SEND':key==='feedbackDraft'?'REWORK':null;if(name){const b=document.querySelector(`[data-e="${name}"]`);if(b)b.disabled=!e.target.value.trim()||(key==='feedbackDraft'&&unavailable())}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='e-space')action({type:'SPACE',id:el.value});else if(el.id==='e-project')action({type:'PROJECT',id:el.value});else if(el.id==='e-scenario')scenario(el.value);else if(el.id==='e-config-scope')dispatch({type:'CONFIG_SCOPE',value:el.value});else if(el.id==='e-limit')dispatch({type:'LIMIT',value:el.value});else if(el.dataset.echange==='result')dispatch({type:'SELECT',id:el.value});else if(el.dataset.role)dispatch({type:'CONFIG',role:el.dataset.role,key:el.dataset.key,value:el.value});});
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('e-lab'))u.ui.lab=e.target.open;},true);
document.addEventListener('keydown',e=>{if(state.variant!=='E'||!u.ui.modal)return;if(e.key==='Escape'){e.preventDefault();dispatch({type:'CLOSE'});document.querySelector('#e-composer')?.focus({preventScroll:true});}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('.e-modal button:not(:disabled),.e-modal select,.e-modal textarea')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.unifiedDemo={snapshot:()=>M.copy(u),action,scenario,reset:()=>{u=M.initial();repaint()}};
if(!new URLSearchParams(location.search).has('variant')||new URLSearchParams(location.search).get('variant')==='E')state.variant='E';render();
})();
</script>

</body></html>
